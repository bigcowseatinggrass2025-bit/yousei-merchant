<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虛擬刮刮樂 - 幽街商人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            color: white;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .purchase-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .scratch-card {
            background: #ff6b6b;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .scratch-card:hover {
            transform: scale(1.05);
        }
        
        .scratch-card.scratched {
            background: #27ae60;
        }
        
        .scratch-card.claimed {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .card-status {
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .scratch-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 350px;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            background: #27ae60;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }
        
        .prize-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            z-index: 1;
            padding: 20px;
        }
        
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 2;
            touch-action: none;
        }
        
        .scratch-prize {
            font-size: 2.5rem;
            color: #ffd700;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .scratch-result {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(44, 62, 80, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ffd700;
            z-index: 1001;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
        }
        
        .total-winnings {
            background: rgba(46, 204, 113, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px solid #27ae60;
        }
        
        .error-message {
            background: rgba(231, 76, 60, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #e74c3c;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            margin: 10px 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #e67e22, #f39c12);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 虛擬刮刮樂</h1>
            <p>幽街商人專屬刮刮樂系統</p>
        </div>
        
        <div class="purchase-info" id="purchase-info">
            <div>載入中...</div>
        </div>
        
        <div class="error-message" id="error-message" style="display: none;"></div>
        
        <div id="cards-container" class="cards-container">
            <!-- 刮刮樂卡片將在這裡動態生成 -->
        </div>
        
        <div class="total-winnings" id="total-winnings" style="display: none;">
            <h3>🎊 總獎金</h3>
            <div class="scratch-prize" id="total-prize">0兩</div>
            <p>已刮開 <span id="scratched-count">0</span> / <span id="total-count">0</span> 張</p>
        </div>
    </div>
    
    <!-- 刮卡界面 -->
    <div class="overlay" id="overlay"></div>
    
    <div class="scratch-container" id="scratch-container">
        <div class="prize-layer">
            <div>獎金：</div>
            <div class="scratch-prize" id="scratch-prize">0兩</div>
            <div style="font-size: 0.9rem; margin-top: 10px;">刮開塗層查看獎金</div>
        </div>
        <canvas id="scratch-canvas"></canvas>
    </div>
    
    <!-- 刮卡結果 -->
    <div class="scratch-result" id="scratch-result">
        <h3>🎉 恭喜獲得</h3>
        <div class="scratch-prize" id="result-prize">0兩</div>
        <p style="margin: 15px 0;">獎金已記錄到總獎金中</p>
        <button class="btn btn-success" onclick="closeScratchResult()">確認</button>
    </div>

<script>
    let currentScratchData = null;
    let currentCard = null;
    let totalWinnings = 0;

    // 🆕 提取刮刮乐ID的辅助函数
    function getScratchId(param) {
        if (param.startsWith('scratch:')) {
            const base64Data = param.replace('scratch:', '');
            try {
                const decoded = JSON.parse(atob(base64Data));
                return decoded.id;
            } catch (e) {
                return param;
            }
        } else if (param.startsWith('eyJ')) {
            // 纯base64数据，直接作为ID
            return param;
        } else {
            return param;
        }
    }

    // 🆕 修复的URL参数获取函数
    function getScratchIdFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        console.log('🔗 URL参数:', Object.fromEntries(urlParams));
        
        // 优先检查 data 参数
        const dataParam = urlParams.get('data');
        if (dataParam) {
            console.log('✅ 找到data参数:', dataParam);
            return dataParam;
        }
        
        // 兼容旧的 id 参数
        const idParam = urlParams.get('id');
        console.log('🔄 使用id参数:', idParam);
        return idParam;
    }

    // 🆕 修复：根据刮刮乐ID生成卡片ID
    function generateScratchCards(quantity, scratchId) {
        console.log('🎲 生成刮刮卡，数量:', quantity, '刮刮乐ID:', scratchId);
        const cards = [];
        const prizes = ["多謝惠顧", "2兩", "5兩", "10兩", "50兩", "100兩"];
        const weights = [75, 8, 7, 5, 3, 2];
        
        for (let i = 0; i < quantity; i++) {
            // 🆕 使用刮刮乐ID + 索引的方式，確保ID唯一且一致
            const cardId = `${scratchId}_card_${i}`;
            
            let random = Math.random() * 100;
            let prizeIndex = 0;
            let accumulated = 0;
            
            for (let j = 0; j < weights.length; j++) {
                accumulated += weights[j];
                if (random <= accumulated) {
                    prizeIndex = j;
                    break;
                }
            }
            
            cards.push({
                id: cardId,
                prize: prizes[prizeIndex],
                isScratched: false,
                claimed: false
            });
        }
        
        console.log('✅ 生成的卡片:', cards);
        return cards;
    }

    // 🆕 修复的QR碼數據處理
    function processQRCodeData(qrData) {
        console.log('🎯 开始解析QR码数据:', qrData);
        
        try {
            let base64Data = qrData;
            if (qrData.startsWith('scratch:')) {
                base64Data = qrData.replace('scratch:', '');
                console.log('🔧 移除scratch:前缀');
            }
            
            console.log('🔍 Base64数据:', base64Data);
            
            // 解码Base64
            const decodedString = atob(base64Data);
            console.log('🔍 解码后的字符串:', decodedString);
            
            const qrInfo = JSON.parse(decodedString);
            console.log('✅ QR數據解析成功:', qrInfo);
            
            // 🆕 先檢查localStorage中是否已存在
            const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
            let scratchData = allScratches[qrInfo.id];
            
            if (!scratchData) {
                // 🆕 生成卡片時傳入刮刮乐ID
                const cards = generateScratchCards(qrInfo.q, qrInfo.id);
                
                scratchData = {
                    id: qrInfo.id,
                    quantity: qrInfo.q,
                    totalCost: qrInfo.c,
                    timestamp: new Date(qrInfo.t).toISOString(),
                    used: false,
                    cards: cards
                };
                
                // 🆕 立即保存到 localStorage
                allScratches[qrInfo.id] = scratchData;
                localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                console.log('💾 新刮刮乐数据已保存到localStorage');
            }
            
            // 🆕 使用 localStorage 中的数据（不是新生成的）
            currentScratchData = scratchData;
            
            console.log('💾 最终使用的刮刮乐数据:', currentScratchData);
            
            // 计算总奖金和渲染
            calculateTotalWinnings();
            updatePurchaseInfo();
            renderCards();
            
        } catch (error) {
            console.error('❌ QR碼數據解析錯誤:', error);
            showError('無效的QR碼格式: ' + error.message);
        }
    }

    // 🆕 修复：强化版保存函数
    function saveScratchData() {
        if (!currentScratchData) {
            console.log('❌ 沒有刮刮樂數據可保存');
            return;
        }
        
        console.log('💾 開始保存刮刮樂數據:', currentScratchData.id);
        
        try {
            // 🆕 深拷貝數據，避免引用問題
            const dataToSave = JSON.parse(JSON.stringify(currentScratchData));
            
            const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
            allScratches[dataToSave.id] = dataToSave;
            
            // 🆕 同步保存（不使用異步）
            localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
            
            // 🆕 添加保存時間戳
            localStorage.setItem('lastScratchSave_' + dataToSave.id, Date.now().toString());
            
            console.log('✅ 刮刮樂數據已保存');
            
            // 🆕 立即驗證保存是否成功
            const verify = JSON.parse(localStorage.getItem('virtualScratchCards'))[dataToSave.id];
            console.log('🔍 保存驗證:', verify ? '成功' : '失敗');
            
        } catch (error) {
            console.error('❌ 保存失敗:', error);
            
            // 🆕 備份到 sessionStorage
            try {
                sessionStorage.setItem('scratch_backup_' + currentScratchData.id, 
                    JSON.stringify(currentScratchData));
                console.log('🔄 已備份到 sessionStorage');
            } catch (e) {
                console.error('❌ 備份也失敗:', e);
            }
        }
    }

    // 🆕 修复的刮刮乐数据加载函数
    function loadScratchData() {
        const scratchParam = getScratchIdFromURL();
        
        if (!scratchParam) {
            showError('無效的刮刮樂連結');
            return;
        }
        
        // 🆕 先檢查 sessionStorage 備份（刷新時可能只有這裡有數據）
        const backupKey = 'scratch_backup_' + getScratchId(scratchParam);
        const backupData = sessionStorage.getItem(backupKey);
        
        if (backupData) {
            console.log('🔄 從sessionStorage恢復備份數據');
            try {
                currentScratchData = JSON.parse(backupData);
                
                // 🆕 恢復到 localStorage
                const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                allScratches[currentScratchData.id] = currentScratchData;
                localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                
                // 🆕 清理備份
                sessionStorage.removeItem(backupKey);
                
                console.log('✅ 備份數據恢復成功');
                
            } catch (e) {
                console.error('恢復備份失敗:', e);
            }
        }
        
        // 🆕 关键修复：检查 localStorage 中是否已有此刮刮乐数据
        const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
        console.log('🔍 localStorage中的刮刮樂數量:', Object.keys(allScratches).length);
        
        // 从URL提取ID
        let scratchId = getScratchId(scratchParam);
        
        // 🆕 如果 localStorage 中有数据，使用它（包括已使用状态）
        if (allScratches[scratchId]) {
            currentScratchData = allScratches[scratchId];
            console.log('✅ 從localStorage加載數據:', currentScratchData);
            
            if (currentScratchData.used) {
                showError('此刮刮樂已被使用');
                document.getElementById('cards-container').innerHTML = '';
                document.getElementById('total-winnings').style.display = 'none';
                document.getElementById('purchase-info').innerHTML = '<div>此刮刮樂已完成兌獎</div>';
                return;
            }
            
            // 🆕 修复：确保计算总奖金
            calculateTotalWinnings();
            updatePurchaseInfo();
            renderCards();
            return;
        }
        
        // 🆕 如果是QR碼數據格式（新格式）
        if (scratchParam.startsWith('scratch:') || scratchParam.startsWith('eyJ')) {
            processQRCodeData(scratchParam);
            return;
        }
        
        // 原有localStorage邏輯（舊格式）
        currentScratchData = allScratches[scratchParam];
        
        if (!currentScratchData) {
            showError('刮刮樂數據不存在或已過期');
            return;
        }
        
        // 🆕 檢查是否已使用
        if (currentScratchData.used) {
            showError('此刮刮樂已被使用');
            document.getElementById('cards-container').innerHTML = '';
            document.getElementById('total-winnings').style.display = 'none';
            document.getElementById('purchase-info').innerHTML = '<div>此刮刮樂已完成兌獎</div>';
            return;
        }
        
        // 🆕 如果沒有cards，就隨機生成（帶ID）
        if (!currentScratchData.cards) {
            currentScratchData.cards = generateScratchCards(currentScratchData.quantity, currentScratchData.id);
        }
        
        // 🆕 修复：确保计算总奖金
        calculateTotalWinnings();
        updatePurchaseInfo();
        renderCards();
    }

    // 🆕 更新購買信息顯示
    function updatePurchaseInfo() {
        if (!currentScratchData) {
            console.log('❌ 没有刮刮乐数据可用于更新购买信息');
            return;
        }
        
        console.log('📊 更新购买信息:', currentScratchData);
        
        document.getElementById('purchase-info').innerHTML = `
            <div><strong>購買數量：</strong>${currentScratchData.quantity}張</div>
            <div><strong>總金額：</strong>${currentScratchData.totalCost}兩</div>
            <div><strong>購買時間：</strong>${new Date(currentScratchData.timestamp).toLocaleString()}</div>
        `;
        
        document.getElementById('total-winnings').style.display = 'block';
        document.getElementById('total-count').textContent = currentScratchData.quantity;
        
        console.log('✅ 购买信息更新完成');
    }

    // 🆕 修复：计算总奖金
    function calculateTotalWinnings() {
        if (!currentScratchData || !currentScratchData.cards) {
            totalWinnings = 0;
            return;
        }
        
        totalWinnings = 0;
        currentScratchData.cards.forEach(card => {
            if (card.isScratched && card.prize !== '多謝惠顧') {
                const prizeAmount = parseInt(card.prize);
                if (!isNaN(prizeAmount)) {
                    totalWinnings += prizeAmount;
                }
            }
        });
        
        console.log('💰 计算总奖金:', totalWinnings);
    }

    // 渲染卡片
    function renderCards() {
        const container = document.getElementById('cards-container');
        
        if (!currentScratchData || !currentScratchData.cards) {
            container.innerHTML = '<div class="error-message">數據錯誤</div>';
            return;
        }
        
        container.innerHTML = '';
        
        let scratchedCount = 0;
        
        currentScratchData.cards.forEach(card => {
            const cardElement = document.createElement('div');
            cardElement.className = 'scratch-card';
            
            if (card.claimed) {
                cardElement.classList.add('claimed');
            } else if (card.isScratched) {
                cardElement.classList.add('scratched');
                scratchedCount++;
            }
            
            let statusText = '';
            if (card.claimed) {
                statusText = '已兌獎';
            } else if (card.isScratched) {
                statusText = `已刮開: ${card.prize}`;
            } else {
                statusText = '未刮開';
            }
            
            cardElement.innerHTML = `
                <div style="font-size: 1.2rem; font-weight: bold;">刮刮樂</div>
                <div class="card-status">${statusText}</div>
            `;
            
            if (!card.claimed) {
                cardElement.onclick = () => showScratchCard(card.id);
            }
            
            container.appendChild(cardElement);
        });
        
        // 更新刮開數量
        document.getElementById('scratched-count').textContent = scratchedCount;
        updateTotalWinnings();
        
        // 檢查是否所有卡片都已刮開且未兌獎
        if (checkAllScratched() && !currentScratchData.used) {
            showClaimButton();
        } else {
            hideClaimButton();
        }
    }

    // 顯示刮卡界面
    function showScratchCard(cardId) {
        currentCard = currentScratchData.cards.find(c => c.id === cardId);
        if (!currentCard || currentCard.claimed) return;
        
        document.getElementById('scratch-prize').textContent = currentCard.prize;
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('scratch-container').style.display = 'block';
        
        if (currentCard.isScratched) {
            // 已刮開：直接顯示結果
            showScratchResult();
        } else {
            // 未刮開：初始化刮卡畫布
            initScratchCanvas();
        }
    }

  function initScratchCanvas() {
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    
    // 設置畫布尺寸
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    
    // 清除畫布
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 🆕 載入並繪製圖片作為刮層
    const scratchImg = new Image();
    scratchImg.src = 'vw452.png'; // 🎨 你的圖片
    
    scratchImg.onload = function() {
        console.log('✅ 刮層圖片載入成功');
        
        // 繪製圖片（調整大小適應畫布）
        ctx.drawImage(scratchImg, 0, 0, canvas.width, canvas.height);
        
        // 🆕 在圖片上方添加半透明深色層（讓刮層更明顯）
        ctx.fillStyle = 'rgba(50, 50, 50, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 🆕 添加提示文字在圖片上方（可選）
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText('刮開此處', canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 0;
        
        // 設置刮卡事件
        setupScratchEvents();
    };
    
    scratchImg.onerror = function() {
        console.log('❌ 圖片載入失敗，使用預設灰色刮層');
        
        // 圖片載入失敗時的備用樣式（保持原有功能）
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('刮開此處', canvas.width / 2, canvas.height / 2);
        
        setupScratchEvents();
    };
    
    // 🆕 分離事件設置函數
    function setupScratchEvents() {
        // 你原有的滑鼠/觸控事件代碼保持不變
        // 只是移動到這裡，在圖片加載完成後才設置
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        
        function startDrawing(e) {
            isDrawing = true;

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);

    // 檢查刮卡進度
    function checkProgress() {
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        let transparentPixels = 0;
        let totalPixels = 0;
        
        for (let i = 3; i < pixels.length; i += 4) {
            if (pixels[i] === 0) {
                transparentPixels++;
            }
            totalPixels++;
        }
        
        const scratchPercent = (transparentPixels / totalPixels) * 100;
        
        if (currentCard && scratchPercent >= 60 && !currentCard.isScratched) {
            console.log('✅ 刮卡完成，开始保存数据...');
            
            // ✅ 確保同步到數組
            const cardIndex = currentScratchData.cards.findIndex(c => c.id === currentCard.id);
            if (cardIndex !== -1) {
                currentScratchData.cards[cardIndex].isScratched = true;
                console.log('📝 數組中的卡片已更新');
            }
            
            // ✅ 更新單一卡片變數
            currentCard.isScratched = true;
            
            // ✅ 立即同步保存
            saveScratchData();
            
            // ✅ 觸發同步事件
            localStorage.setItem('scratchCardLastUpdate', Date.now().toString());
            
            showScratchResult();
        }
    }

    // 顯示刮卡結果
    function showScratchResult() {
        if (!currentCard) return;
        
        document.getElementById('result-prize').textContent = currentCard.prize;
        document.getElementById('scratch-container').style.display = 'none';
        document.getElementById('scratch-result').style.display = 'block';
        
        // ✅ 這裡不需要再次保存，因為 checkProgress() 已經保存過了
        // 但是重新計算獎金
        calculateTotalWinnings();
        updateTotalWinnings();
        
        // ✅ 直接更新界面（不延遲）
        renderCards();
        
        console.log('🎉 刮卡結果顯示完成');
    }

    // 關閉刮卡結果
    function closeScratchResult() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('scratch-result').style.display = 'none';
        renderCards();
    }

    // 更新總獎金
    function updateTotalWinnings() {
        document.getElementById('total-prize').textContent = totalWinnings + '兩';
    }

    // 顯示錯誤信息
    function showError(message) {
        document.getElementById('error-message').textContent = message;
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('cards-container').innerHTML = '';
    }

    // 檢查是否所有卡片都已刮開
    function checkAllScratched() {
        if (!currentScratchData || !currentScratchData.cards) return false;
        
        const allScratched = currentScratchData.cards.every(card => card.isScratched);
        return allScratched;
    }

    // 顯示兌獎按鈕
    function showClaimButton() {
        const totalWinningsDiv = document.getElementById('total-winnings');
        
        if (!document.getElementById('claim-button')) {
            const claimButton = document.createElement('button');
            claimButton.id = 'claim-button';
            claimButton.className = 'btn btn-success';
            claimButton.style.cssText = 'font-size: 1.5rem; padding: 15px 30px; margin: 20px auto; display: block;';
            claimButton.innerHTML = '🎊 兌換總獎金 🎊';
            claimButton.onclick = showClaimConfirmation;
            
            totalWinningsDiv.appendChild(claimButton);
        }
    }

    // 隱藏兌獎按鈕
    function hideClaimButton() {
        const claimButton = document.getElementById('claim-button');
        if (claimButton) {
            claimButton.remove();
        }
    }

    // 顯示兌獎確認界面
    function showClaimConfirmation() {
        const claimHTML = `
            <div class="scratch-result" id="claim-confirmation" style="display: block;">
                <h3>🎉 兌獎確認</h3>
                <div class="scratch-prize">${totalWinnings}兩</div>
                <p style="margin: 15px 0;">請向商館兌換獎金</p>
                <div class="action-buttons">
                    <button class="btn btn-warning" onclick="closeClaimConfirmation()">取消</button>
                    <button class="btn btn-success" onclick="claimPrize()">確認兌換</button>
                </div>
            </div>
        `;
        
        document.getElementById('overlay').style.display = 'block';
        document.body.insertAdjacentHTML('beforeend', claimHTML);
    }

    // 關閉兌獎確認
    function closeClaimConfirmation() {
        document.getElementById('overlay').style.display = 'none';
        const claimConfirmation = document.getElementById('claim-confirmation');
        if (claimConfirmation) {
            claimConfirmation.remove();
        }
    }

    // 🆕 修复的確認兌獎函數
    function claimPrize() {
        console.log('🎯 開始兌獎流程');
        
        if (!currentScratchData) {
            console.error('❌ 沒有刮刮樂數據');
            return;
        }
        
        // 標記所有卡片為已兌獎
        currentScratchData.cards.forEach(card => {
            card.claimed = true;
        });
        
        // 標記整個刮刮樂為已使用
        currentScratchData.used = true;
        console.log('✅ 刮刮樂標記為已使用:', currentScratchData.id);
        
        // 🆕 修复：立即保存到localStorage
        saveScratchData();
        
        // 🆕 修复：强制触发storage事件
        const event = new Event('storage');
        window.dispatchEvent(event);
        
        // 🆕 通知父頁面（倉庫頁面）
        if (window.opener) {
            try {
                window.opener.postMessage({ 
                    type: 'SCRATCH_CARD_COMPLETED', 
                    scratchId: currentScratchData.id,
                    prize: totalWinnings
                }, '*');
                console.log('📢 已通知倉庫頁面');
            } catch (e) {
                console.error('通知父頁面失敗:', e);
            }
        }
        
        // 🆕 修复：使用localStorage传递消息
        localStorage.setItem('scratchCardLastUpdate', Date.now().toString());
        localStorage.setItem('scratchCardCompleted', JSON.stringify({
            id: currentScratchData.id,
            prize: totalWinnings,
            timestamp: Date.now()
        }));
        
        // 關閉界面
        closeClaimConfirmation();
        
        // 顯示兌獎成功訊息
        setTimeout(() => {
            alert(`🎉 成功兌換 ${totalWinnings}兩 獎金！`);
            // 不重置頁面，保持當前狀態
            renderCards();
        }, 300);
    }

    // 🆕 強制同步狀態到倉庫頁面
    function forceSyncToWarehouse() {
        console.log('🔄 強制同步狀態到倉庫頁面');
        
        // 方法1: 觸發storage事件
        localStorage.setItem('scratchCardLastUpdate', Date.now().toString());
        
        // 方法2: 直接設置倉庫頁面的標記
        localStorage.setItem('scratchCardForceRefresh', Date.now().toString());
        
        // 方法3: 使用BroadcastChannel（如果支持）
        if (typeof BroadcastChannel !== 'undefined') {
            try {
                const channel = new BroadcastChannel('scratch_card_updates');
                channel.postMessage({ type: 'STATUS_CHANGED', timestamp: Date.now() });
            } catch (e) {
                console.log('BroadcastChannel不支持:', e);
            }
        }
        
        console.log('✅ 狀態同步完成');
    }

    // 🆕 頁面卸載保護
    function setupPageUnloadProtection() {
        let isUnloading = false;
        
        // 頁面即將卸載
        window.addEventListener('beforeunload', function(e) {
            if (!isUnloading && currentScratchData) {
                isUnloading = true;
                console.log('⚠️ 頁面即將卸載，強制保存數據');
                
                // 同步保存
                try {
                    const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                    allScratches[currentScratchData.id] = currentScratchData;
                    localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                    
                    // 添加驗證
                    const verify = JSON.parse(localStorage.getItem('virtualScratchCards'))[currentScratchData.id];
                    console.log('🔍 卸載前保存驗證:', verify ? '成功' : '失敗');
                } catch (error) {
                    console.error('卸載保存失敗:', error);
                }
            }
        });
        
        // 定時保存備份（每10秒）
        setInterval(() => {
            if (currentScratchData && !isUnloading) {
                try {
                    const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                    allScratches[currentScratchData.id] = currentScratchData;
                    localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                    console.log('⏰ 定時備份保存完成');
                } catch (e) {
                    console.error('定時備份失敗:', e);
                }
            }
        }, 10000);
    }

    // 初始化
    window.addEventListener('load', function() {
        loadScratchData();
        setupPageUnloadProtection(); // 🆕 添加頁面卸載保護
    });

    // 🆕 修复：添加storage事件监听，确保数据同步
    window.addEventListener('storage', function(e) {
        console.log('📦 Storage事件触发:', e.key);
        if (e.key === 'virtualScratchCards') {
            // 重新加载数据
            loadScratchData();
        }
    });
</script>
