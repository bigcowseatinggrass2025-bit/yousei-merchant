<!DOCTYPE html>
<html>
<head>
    <title>相機測試</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
        }
        video {
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: #000;
            border: 3px solid red;
            margin: 20px auto;
            display: block;
        }
        .status {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>📷 相機功能測試</h1>
    <button onclick="startCamera()">開啟相機</button>
    <button onclick="stopCamera()">關閉相機</button>
    
    <div id="status" class="status"></div>
    <video id="video" autoplay playsinline muted></video>
    
    <script>
        let currentStream = null;
        
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? '#ffcccc' : '#ccffcc';
            status.style.color = isError ? '#c00' : '#060';
            console.log('📢 ' + message);
        }
        
        function startCamera() {
            updateStatus('請求相機權限中...');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                }).then(stream => {
                    currentStream = stream;
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        updateStatus('✅ 相機啟動成功！等待畫面...');
                        video.play().then(() => {
                            updateStatus('🎉 視頻播放成功！尺寸: ' + video.videoWidth + 'x' + video.videoHeight);
                            video.style.border = '3px solid green';
                        }).catch(e => {
                            updateStatus('❌ 播放失敗: ' + e.message, true);
                        });
                    };
                    
                }).catch(error => {
                    updateStatus('❌ 相機錯誤: ' + error.message, true);
                });
            } else {
                updateStatus('❌ 瀏覽器不支持相機', true);
            }
        }
        
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                updateStatus('相機已關閉');
                document.getElementById('video').style.border = '3px solid gray';
            }
        }
        
        // 頁面加載時顯示環境信息
        updateStatus('📍 當前網址: ' + window.location.href + 
                    ' | 協議: ' + window.location.protocol);
    </script>
</body>
</html>
