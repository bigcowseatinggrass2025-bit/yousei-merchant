<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的幽街貨卡倉庫</title>
    <!-- 🎯 添加Supabase库引用 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 手机端专用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .player-name {
            font-size: 1.3rem;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .last-updated {
            font-size: 0.9rem;
            color: #bbb;
        }
        
        /* 筛选标签样式 */
        .filter-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-tab {
            flex: 0 0 auto;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .filter-tab.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        
        /* 详情面板 */
        .detail-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .detail-title {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .close-detail {
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .detail-goods {
            grid-column: 1 / -1;
        }
        
        .goods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .goods-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .price-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 货卡网格布局 - 每行3张卡片 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .warehouse-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .warehouse-card:hover {
            transform: translateY(-2px);
        }
        
        /* 稀有度边框颜色 */
        .warehouse-card.ghost { 
            border-color: #3498db;
            animation: ghost-glow 2s infinite alternate;
        }
        .warehouse-card.fairy { 
            border-color: #9b59b6;
            animation: fairy-glow 2s infinite alternate;
        }
        .warehouse-card.immortal { 
            border-color: #00ffcc;
            animation: immortal-glow 1.8s infinite alternate;
        }
        .warehouse-card.king { 
            border-color: #8b0000;
            animation: king-dark-glow 1.5s infinite alternate;
        }
        .warehouse-card.celestial { 
            border-color: #ffcc00;
            animation: celestial-glow 1.2s infinite alternate;
        }
        
        .card-name {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.85rem;
            line-height: 1.2;
        }
        
        .card-goods {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .goods-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.65rem;
        }
        
        .card-prices {
            font-size: 0.7rem;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .card-rarity {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        
        /* 货物颜色 */
        .goods-fanhuo { background: #27ae60; }
        .goods-wenwan { background: #9b59b6; }
        .goods-yishou { background: #2980b9; }
        .goods-yantie { background: #3498db; }
        .goods-huoqi { background: #e74c3c; }
        .goods-qiwu { background: #f39c12; }
        
        /* 发光动画 */
        @keyframes ghost-glow {
            from { box-shadow: 0 0 5px #3498db; }
            to { box-shadow: 0 0 15px #3498db, 0 0 25px #3498db; }
        }
        
        @keyframes fairy-glow {
            from { box-shadow: 0 0 5px #9b59b6; }
            to { box-shadow: 0 0 15px #9b59b6, 0 0 25px #9b59b6; }
        }
        
        @keyframes immortal-glow {
            from { box-shadow: 0 0 5px #00ffcc; }
            to { box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ff99, 0 0 35px #00ffcc; }
        }
        
        @keyframes king-dark-glow {
            from { box-shadow: 0 0 5px #8b0000; }
            to { box-shadow: 0 0 15px #8b0000, 0 0 30px #ff0000, 0 0 45px #8b0000; }
        }
        
        @keyframes celestial-glow {
            from { box-shadow: 0 0 5px #ffffff; }
            to { box-shadow: 0 0 20px #ffffff, 0 0 40px #ffff00, 0 0 60px #ffffff; }
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            width: 100%;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
            font-size: 0.9rem;
        }

        /* 隐私保护遮罩样式 */
        .privacy-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transition: opacity 2s ease;
        }

        .privacy-mask::before {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            opacity: 0.3;
        }

        .privacy-mask.show {
            opacity: 1;
        }

        .privacy-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 15px;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        .privacy-hint {
            position: absolute;
            bottom: 100px;
            color: #bbb;
            font-size: 1rem;
            text-align: center;
            z-index: 1;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* 幽街浮动按钮 */
        .youjie-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 50%;
            color: #1a2a3a;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }

        .youjie-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 幽街貨卡倉庫</h1>
            <div class="player-info">
                <div class="player-name" id="player-name">載入中...</div>
                <div class="last-updated" id="last-updated"></div>
            </div>
        </div>
        
        <!-- 筛选标签 -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all">全部</div>
            <div class="filter-tab" data-filter="ghost">幽魂</div>
            <div class="filter-tab" data-filter="fairy">妖精</div>
            <div class="filter-tab" data-filter="immortal">仙使</div>
            <div class="filter-tab" data-filter="king">大王</div>
            <div class="filter-tab" data-filter="celestial">天尊</div>
        </div>
        
        <!-- 货卡网格 -->
        <div id="cards-container">
            <div class="loading" id="loading">
                <p>🔄 載入貨卡資料中...</p>
            </div>
        </div>
        
        <!-- 详情面板 -->
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header">
                <div class="detail-title" id="detail-title">貨卡詳情</div>
                <button class="close-detail" id="close-detail">×</button>
            </div>
            <div class="detail-content">
                <div class="detail-goods">
                    <div>貨物:</div>
                    <div class="goods-tags" id="detail-goods"></div>
                </div>
                <div class="price-info">
                    <div>獲得靈石</div>
                    <div id="detail-buy-price">0顆</div>
                </div>
                <div class="price-info">
                    <div>賣出價格</div>
                    <div id="detail-sell-price">0兩</div>
                </div>
            </div>
        </div>
        
        <button class="refresh-btn" id="refresh-btn">🔄 刷新資料</button>
        
        <div class="footer">
            <p>幽街商人 - 手機倉庫查看</p>
            <p>數據自動更新 | v1.2</p>
        </div>
    </div>
    
    <!-- 新增的隐私保护元素 -->
    <div class="privacy-mask" id="privacy-mask">
        <div class="privacy-text">幽街商人</div>
        <div class="privacy-hint">點擊螢幕返回</div>
    </div>

    <button class="youjie-btn" id="youjie-btn">幽街</button>

    <script>
        // 🎯 在脚本最顶部创建Supabase客户端
        const SUPABASE_URL = 'https://yfjvwwkelkvnlcdyqeck.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6OMKW1OxdLUhY3U3VGEYcQ_JIfFrFOP';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 从URL获取玩家信息 - 修复参数名
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('p'); // 修复：改为 'p'
        const playerName = urlParams.get('name') || '幽街商人'; // 修复：默认名称

        // 显示玩家信息
        document.getElementById('player-name').textContent = playerName;
        document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();

        let currentCards = [];
        
        // 货物名称映射
        const goodsNameMapping = {
            "番": "番貨",
            "文": "文玩", 
            "異": "異獸",
            "鹽": "鹽錠",
            "炮": "火器",
            "奇": "奇物"
        };

        // 🎯 隐私保护功能
        document.getElementById('youjie-btn').addEventListener('click', function() {
            const mask = document.getElementById('privacy-mask');
            mask.style.display = 'flex';
            setTimeout(() => mask.classList.add('show'), 10);
        });

        document.getElementById('privacy-mask').addEventListener('click', function() {
            this.classList.remove('show');
            setTimeout(() => this.style.display = 'none', 2000);
        });

        // 🧹 清理函数（放在 loadPlayerDataFromSupabase 前面）
async function cleanupExpiredWarehouses() {
    try {
        const 四小时前 = new Date(Date.now() - 4 * 60 * 60 * 1000);
        
        const { error } = await supabaseClient
            .from('player_warehouses')
            .delete()
            .lt('created_at', 四小时前.toISOString());
        
        if (!error) {
            console.log('🧹 已清理4小时前的过期仓库数据');
        }
    } catch (error) {
        console.log('清理数据时出错:', error);
    }
}

        // 🎯 从Supabase加载真实数据
        async function loadPlayerDataFromSupabase() {
            try {
                  // 🧹 新增这一行！调用清理函数
                 await cleanupExpiredWarehouses();
                console.log('📱 从Supabase加载玩家数据...');
                console.log('🎯 玩家ID:', playerId);
                
                if (!playerId) {
                    console.log('❌ 未找到玩家ID参数');
                    displayTestData();
                    return;
                }
                
                const { data, error } = await supabaseClient
                    .from('player_warehouses')
                    .select('*')
                    .eq('player_id', playerId);
                    
                console.log('🔍 Supabase响应:', { data, error });
                
                if (error) {
                    console.error('❌ Supabase查询错误:', error);
                    displayTestData();
                    return;
                }
                
                if (data && data.length > 0) {
    const playerData = data[0];
    console.log('✅ 获取到玩家数据:', playerData);
    
    document.getElementById('player-name').textContent = playerData.player_name || playerName;
    // 修复：添加这行来更新时间显示
    document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();
    
    if (playerData.warehouse_data && playerData.warehouse_data.goodsCards) {
        console.log('🎯 渲染真实货卡数据:', playerData.warehouse_data.goodsCards);
        renderCards(playerData.warehouse_data.goodsCards);
    } else {
        console.log('⚠️ 仓库数据为空');
        renderCards([]);
    }

                } else {
                    console.log('❌ 未找到玩家数据');
                    displayTestData();
                }
                
            } catch (error) {
                console.error('❌ 数据加载异常:', error);
                displayTestData();
            }
        }

        // 🎯 显示测试数据（备用方案）
        function displayTestData() {
            const testCards = [
                {
                    name: "幽魂貨卡",
                    rarity: "ghost",
                    goodsCount: 2,
                    buyPrice: 16,
                    sellPrice: 50,
                    goods: [
                        { name: "番", color: "goods-fanhuo" },
                        { name: "文", color: "goods-wenwan" }
                    ]
                },
                {
                    name: "妖精貨卡", 
                    rarity: "fairy",
                    goodsCount: 3,
                    buyPrice: 25,
                    sellPrice: 75,
                    goods: [
                        { name: "異", color: "goods-yishou" },
                        { name: "鹽", color: "goods-yantie" },
                        { name: "火", color: "goods-huoqi" }
                    ]
                }
            ];

            currentCards = testCards;
            renderCards(testCards);
            
            document.getElementById('player-name').textContent = playerName + ' (測試模式)';
            document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();
        }

        // 🎯 标签筛选功能
        function setupFilterTabs() {
            const filterTabs = document.querySelectorAll('.filter-tab');
            
            filterTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    filterTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const filter = this.dataset.filter;
                    filterCards(filter);
                });
            });
        }

        // 🎯 筛选卡片函数
        function filterCards(rarity) {
            const cards = document.querySelectorAll('.warehouse-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                if (rarity === 'all' || card.classList.contains(rarity)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            
            console.log(`🎯 筛选显示: ${rarity} 稀有度, 显示 ${visibleCount} 张卡片`);
        }

        // 显示卡片详情
        function showCardDetail(cardIndex) {
            const card = currentCards[cardIndex];
            if (!card) return;

            document.getElementById('detail-title').textContent = card.name;
            document.getElementById('detail-buy-price').textContent = card.buyPrice + '顆';
            document.getElementById('detail-sell-price').textContent = card.sellPrice + '兩';
            
            const goodsTags = document.getElementById('detail-goods');
            goodsTags.innerHTML = card.goods.map(good => {
                const shortName = good.name;
                const fullName = goodsNameMapping[shortName] || shortName;
                return `<div class="goods-tag ${good.color}">[${shortName}]${fullName}</div>`;
            }).join('');
            
            document.getElementById('detail-panel').style.display = 'block';
        }

        // 🎯 渲染货卡
        function renderCards(cards) {
            const container = document.getElementById('cards-container');
            
            if (!cards || cards.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📭 倉庫中沒有貨物交易卡</p>
                        <p>回到遊戲中獲取更多貨卡吧！</p>
                    </div>
                `;
                return;
            }

            currentCards = cards;
            
            const cardsHtml = cards.map((card, index) => {
                return `
                    <div class="warehouse-card ${card.rarity}" onclick="showCardDetail(${index})">
                        <div class="card-name">${card.name}</div>
                        <div class="card-goods">
                            ${card.goods.map(good => {
                                const shortName = good.name;
                                const fullName = goodsNameMapping[shortName] || shortName;
                                return `<div class="goods-circle ${good.color}" title="${fullName}">${shortName}</div>`;
                            }).join('')}
                        </div>
                        <div class="card-prices">
                            <div>靈石: ${card.buyPrice}顆</div>
                            <div>價格: ${card.sellPrice}兩</div>
                        </div>
                        <div class="card-rarity">${getRarityName(card.rarity)}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="cards-grid">${cardsHtml}</div>`;
            
            // 初始化筛选功能
            setTimeout(() => {
                setupFilterTabs();
            }, 100);
        }

        // 获取稀有度中文名称
        function getRarityName(rarity) {
            const rarityNames = {
                'ghost': '幽魂',
                'fairy': '妖精', 
                'immortal': '仙使',
                'king': '大王',
                'celestial': '天尊'
            };
            return rarityNames[rarity] || rarity;
        }

        // 关闭详情面板
        document.getElementById('close-detail').addEventListener('click', function() {
            document.getElementById('detail-panel').style.display = 'none';
        });

        // 🎯 自动刷新数据
        let autoRefreshInterval;

        function startAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            autoRefreshInterval = setInterval(() => {
                console.log('🔄 自动刷新数据...');
                loadPlayerDataFromSupabase();
            }, 10000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // 刷新按钮事件
        document.getElementById('refresh-btn').addEventListener('click', function() {
            console.log('🔄 手动刷新数据');
            loadPlayerDataFromSupabase();
        });

        // 页面可见性控制
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        });

        // 🎯 页面加载时获取真实数据
        window.addEventListener('load', function() {
            loadPlayerDataFromSupabase();
            setTimeout(() => {
                startAutoRefresh();
            }, 3000);
        });
    </script>
</body>
</html>
