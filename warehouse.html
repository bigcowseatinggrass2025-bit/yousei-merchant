<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的幽街貨卡倉庫</title>
    <style>
        /* 手机端专用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .player-name {
            font-size: 1.3rem;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .last-updated {
            font-size: 0.9rem;
            color: #bbb;
        }
        
        /* 详情面板 */
        .detail-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .detail-title {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .close-detail {
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .detail-goods {
            grid-column: 1 / -1;
        }
        
        .goods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .goods-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .price-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 货卡网格布局 - 缩小尺寸 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .warehouse-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .warehouse-card:hover {
            transform: translateY(-2px);
        }
        
        /* 稀有度边框颜色 */
        .warehouse-card.ghost { 
            border-color: #3498db;
            animation: ghost-glow 2s infinite alternate;
        }
        .warehouse-card.fairy { 
            border-color: #9b59b6;
            animation: fairy-glow 2s infinite alternate;
        }
        .warehouse-card.immortal { 
            border-color: #00ffcc;
            animation: immortal-glow 1.8s infinite alternate;
        }
        .warehouse-card.king { 
            border-color: #8b0000;
            animation: king-dark-glow 1.5s infinite alternate;
        }
        .warehouse-card.celestial { 
            border-color: #ffcc00;
            animation: celestial-glow 1.2s infinite alternate;
        }
        
        .card-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.9rem;
            line-height: 1.2;
        }
        
        .card-goods {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .goods-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
        }
        
        .card-prices {
            font-size: 0.75rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        
        .card-rarity {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        
        /* 货物颜色 */
        .goods-fanhuo { background: #27ae60; }
        .goods-wenwan { background: #9b59b6; }
        .goods-yishou { background: #2980b9; }
        .goods-yantie { background: #3498db; }
        .goods-huoqi { background: #e74c3c; }
        .goods-qiwu { background: #f39c12; }
        
        /* 发光动画 */
        @keyframes ghost-glow {
            from { box-shadow: 0 0 5px #3498db; }
            to { box-shadow: 0 0 15px #3498db, 0 0 25px #3498db; }
        }
        
        @keyframes fairy-glow {
            from { box-shadow: 0 0 5px #9b59b6; }
            to { box-shadow: 0 0 15px #9b59b6, 0 0 25px #9b59b6; }
        }
        
        @keyframes immortal-glow {
            from { box-shadow: 0 0 5px #00ffcc; }
            to { box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ff99, 0 0 35px #00ffcc; }
        }
        
        @keyframes king-dark-glow {
            from { box-shadow: 0 0 5px #8b0000; }
            to { box-shadow: 0 0 15px #8b0000, 0 0 30px #ff0000, 0 0 45px #8b0000; }
        }
        
        @keyframes celestial-glow {
            from { box-shadow: 0 0 5px #ffffff; }
            to { box-shadow: 0 0 20px #ffffff, 0 0 40px #ffff00, 0 0 60px #ffffff; }
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            width: 100%;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="header">
        <h1>📱 幽街貨卡倉庫</h1>
        <div class="player-info">
            <div class="player-name" id="player-name">載入中...</div>
            <div class="last-updated" id="last-updated"></div>
        </div>
    </div>
    
    <!-- 货卡网格应该在上面 -->
    <div id="cards-container">
        <div class="loading" id="loading">
            <p>🔄 載入貨卡資料中...</p>
        </div>
    </div>
    
    <!-- 详情面板应该在货卡下面，刷新按钮上面 -->
    <div class="detail-panel" id="detail-panel">
        <div class="detail-header">
            <div class="detail-title" id="detail-title">貨卡詳情</div>
            <button class="close-detail" id="close-detail">×</button>
        </div>
        <div class="detail-content">
            <div class="detail-goods">
                <div>貨物:</div>
                <div class="goods-tags" id="detail-goods"></div>
            </div>
            <div class="price-info">
                <div>獲得靈石</div>
                <div id="detail-buy-price">0顆</div>
            </div>
            <div class="price-info">
                <div>賣出價格</div>
                <div id="detail-sell-price">0兩</div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" id="refresh-btn">🔄 刷新資料</button>
    
    <div class="footer">
        <p>幽街商人 - 手機倉庫查看</p>
        <p>數據自動更新 | v1.0</p>
    </div>
</div>

    <script>
       // 在warehouse.html中
const urlParams = new URLSearchParams(window.location.search);
const playerId = urlParams.get('p');      // 从Bitly的p参数读取
const playerName = urlParams.get('n') || '未知玩家'; // 从Bitly的n参数读取

        // 显示玩家信息
        document.getElementById('player-name').textContent = playerName;
        document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();

        let currentCards = [];

        // 模拟从Supabase获取数据
        function loadPlayerGoodsCards() {
            console.log('加載玩家貨卡數據:', playerId, playerName);
            
            // 这里暂时显示测试数据，后面会连接Supabase
            displayTestData();
        }

        // 显示测试数据
        function displayTestData() {
            const testCards = [
                {
                    name: "幽魂貨卡",
                    rarity: "ghost",
                    goodsCount: 2,
                    buyPrice: 16,
                    sellPrice: 50,
                    goods: [
                        { name: "番貨", color: "goods-fanhuo" },
                        { name: "文玩", color: "goods-wenwan" }
                    ]
                },
                {
                    name: "妖精貨卡", 
                    rarity: "fairy",
                    goodsCount: 3,
                    buyPrice: 25,
                    sellPrice: 75,
                    goods: [
                        { name: "異獸", color: "goods-yishou" },
                        { name: "鹽鐵", color: "goods-yantie" },
                        { name: "火器", color: "goods-huoqi" }
                    ]
                },
                {
                    name: "仙使貨卡",
                    rarity: "immortal", 
                    goodsCount: 4,
                    buyPrice: 45,
                    sellPrice: 120,
                    goods: [
                        { name: "番貨", color: "goods-fanhuo" },
                        { name: "文玩", color: "goods-wenwan" },
                        { name: "異獸", color: "goods-yishou" },
                        { name: "奇物", color: "goods-qiwu" }
                    ]
                }
            ];

            currentCards = testCards;
            renderCards(testCards);
        }

        // 显示卡片详情
        function showCardDetail(cardIndex) {
            const card = currentCards[cardIndex];
            if (!card) return;

            // 更新详情面板内容
            document.getElementById('detail-title').textContent = card.name;
            document.getElementById('detail-buy-price').textContent = card.buyPrice + '顆';
            document.getElementById('detail-sell-price').textContent = card.sellPrice + '兩';
            
            // 更新货物标签
            const goodsTags = document.getElementById('detail-goods');
            goodsTags.innerHTML = card.goods.map(good => 
                `<div class="goods-tag ${good.color}">[${good.name.charAt(0)}]${good.name}</div>`
            ).join('');
            
            // 显示详情面板
            document.getElementById('detail-panel').style.display = 'block';
        }

        // 渲染货卡
        function renderCards(cards) {
            const container = document.getElementById('cards-container');
            
            if (cards.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>📭 倉庫中沒有貨物交易卡</p>
                        <p>回到遊戲中獲取更多貨卡吧！</p>
                    </div>
                `;
                return;
            }

            const cardsHtml = cards.map((card, index) => `
                <div class="warehouse-card ${card.rarity}" onclick="showCardDetail(${index})">
                    <div class="card-name">${card.name}</div>
                    <div class="card-goods">
                        ${card.goods.map(good => 
                            `<div class="goods-circle ${good.color}" title="${good.name}">${good.name.charAt(0)}</div>`
                        ).join('')}
                    </div>
                    <div class="card-prices">
                        <div>靈石: ${card.buyPrice}顆</div>
                        <div>價格: ${card.sellPrice}兩</div>
                    </div>
                    <div class="card-rarity">${getRarityName(card.rarity)}</div>
                </div>
            `).join('');

            container.innerHTML = `<div class="cards-grid">${cardsHtml}</div>`;
        }

        // 获取稀有度中文名称
        function getRarityName(rarity) {
            const rarityNames = {
                'ghost': '幽魂',
                'fairy': '妖精', 
                'immortal': '仙使',
                'king': '大王',
                'celestial': '天尊'
            };
            return rarityNames[rarity] || rarity;
        }

        // 关闭详情面板
        document.getElementById('close-detail').addEventListener('click', function() {
            document.getElementById('detail-panel').style.display = 'none';
        });

        // 刷新按钮事件
        document.getElementById('refresh-btn').addEventListener('click', function() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('cards-container').innerHTML = `
                <div class="loading">
                    <p>🔄 刷新資料中...</p>
                </div>
            `;
            
            setTimeout(() => {
                loadPlayerGoodsCards();
                document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();
                document.getElementById('detail-panel').style.display = 'none';
            }, 1000);
        });

        // 页面加载时获取数据
        window.addEventListener('load', function() {
            setTimeout(loadPlayerGoodsCards, 500);
        });
    </script>
</body>

</html>
