<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的幽街貨卡倉庫</title>
    <!-- 🎯 添加Supabase库引用 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        /* 手机端专用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: 
                linear-gradient(rgba(26, 42, 58, 0.7), rgba(44, 62, 80, 0.7)),
                url('images/hbgvdfh53.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .player-name {
            font-size: 1.3rem;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .last-updated {
            font-size: 0.9rem;
            color: #bbb;
        }
        
        /* 🆕 分類按鈕樣式 */
        .category-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }
        
        .category-tab {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #bbb;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }
        
        .category-tab.active {
            background: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .category-tab .count {
            font-size: 0.8rem;
            color: #3498db;
            margin-top: 4px;
            font-weight: bold;
        }
        
        .category-tab.active .count {
            color: #ffd700;
        }
        
        /* 筛选标签样式 */
        .filter-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-tab {
            flex: 0 0 auto;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .filter-tab.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        
        /* 详情面板 */
        .detail-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .detail-title {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .close-detail {
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .detail-goods {
            grid-column: 1 / -1;
        }
        
        .goods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .goods-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .price-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 🆕 详情面板扩展样式 */
        .detail-card-effect {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .detail-card-cost {
            background: rgba(39, 174, 96, 0.2);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 货卡网格布局 - 每行3张卡片 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .warehouse-card {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .warehouse-card:hover {
            transform: translateY(-2px);
        }
        
        /* 稀有度边框颜色 */
        .warehouse-card.ghost { 
            border-color: #3498db;
            animation: ghost-glow 2s infinite alternate;
        }
        .warehouse-card.fairy { 
            border-color: #9b59b6;
            animation: fairy-glow 2s infinite alternate;
        }
        .warehouse-card.immortal { 
            border-color: #00ffcc;
            animation: immortal-glow 1.8s infinite alternate;
        }
        .warehouse-card.king { 
            border-color: #8b0000;
            animation: king-dark-glow 1.5s infinite alternate;
        }
        .warehouse-card.celestial { 
            border-color: #ffcc00;
            animation: celestial-glow 1.2s infinite alternate;
        }
        
        /* 🆕 神秘卡片網格樣式 */
        .mystery-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .mystery-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .mystery-card:hover {
            transform: translateY(-2px);
        }
        
        /* 神秘卡片稀有度顏色 */
        .mystery-card.normal { border-color: #3498db; }
        .mystery-card.rare { border-color: #9b59b6; }
        .mystery-card.magic { border-color: #00ffcc; }
        .mystery-card.epic { border-color: #e74c3c; }
        .mystery-card.legendary { border-color: #f39c12; }
        .mystery-card.ancient { border-color: #8b0000; }
        .mystery-card.divine { border-color: #ffcc00; }
        .mystery-card.junk { border-color: #95a5a6; }
        
        /* 神秘卡片發光效果 */
        .mystery-card.normal { animation: normal-glow 2s infinite alternate; }
        .mystery-card.rare { animation: rare-glow 2s infinite alternate; }
        .mystery-card.magic { animation: magic-glow 2s infinite alternate; }
        .mystery-card.epic { animation: epic-glow 2s infinite alternate; }
        .mystery-card.legendary { animation: legendary-glow 2s infinite alternate; }
        .mystery-card.ancient { animation: ancient-glow 2s infinite alternate; }
        .mystery-card.divine { animation: divine-glow 2s infinite alternate; }
        
        .mystery-card-name {
            font-weight: bold;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .mystery-card-description {
            font-size: 0.75rem;
            color: #ccc;
            line-height: 1.3;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .mystery-card-cost {
            font-size: 0.7rem;
            color: #27ae60;
            font-weight: bold;
            text-align: center;
        }
        
        /* 🆕 裝備網格樣式 */
        .equipment-grid-view {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .equipment-slot-view {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid rgba(52, 152, 219, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 100px;
        }
        
        .equipment-slot-view:hover {
            transform: translateY(-2px);
            border-color: #3498db;
        }
        
        .equipment-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-size: 0.8rem;
            border-style: dashed;
        }
        
        .slot-type {
            font-size: 0.7rem;
            color: #3498db;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .equipment-name {
            font-size: 0.9rem;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .equipment-bonuses {
            font-size: 0.75rem;
            color: #27ae60;
        }
        
        .equipment-description {
            font-size: 0.7rem;
            color: #bbb;
            margin-top: 5px;
        }
        
        .card-name {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.85rem;
            line-height: 1.2;
        }
        
        .card-goods {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .goods-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.65rem;
        }
        
        .card-prices {
            font-size: 0.7rem;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .card-rarity {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        
        /* 货物颜色 */
        .goods-fanhuo { background: #27ae60; }
        .goods-wenwan { background: #9b59b6; }
        .goods-yishou { background: #2980b9; }
        .goods-yantie { background: #3498db; }
        .goods-huoqi { background: #e74c3c; }
        .goods-qiwu { background: #f39c12; }
        
        /* 发光动画 */
        @keyframes ghost-glow {
            from { box-shadow: 0 0 5px #3498db; }
            to { box-shadow: 0 0 15px #3498db, 0 0 25px #3498db; }
        }
        
        @keyframes fairy-glow {
            from { box-shadow: 0 0 5px #9b59b6; }
            to { box-shadow: 0 0 15px #9b59b6, 0 0 25px #9b59b6; }
        }
        
        @keyframes immortal-glow {
            from { box-shadow: 0 0 5px #00ffcc; }
            to { box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ff99, 0 0 35px #00ffcc; }
        }
        
        @keyframes king-dark-glow {
            from { box-shadow: 0 0 5px #8b0000; }
            to { box-shadow: 0 0 15px #8b0000, 0 0 30px #ff0000, 0 0 45px #8b0000; }
        }
        
        @keyframes celestial-glow {
            from { box-shadow: 0 0 5px #ffffff; }
            to { box-shadow: 0 0 20px #ffffff, 0 0 40px #ffff00, 0 0 60px #ffffff; }
        }
        
        /* 🆕 神秘卡片發光動畫 */
        @keyframes normal-glow { from { box-shadow: 0 0 5px #3498db; } to { box-shadow: 0 0 15px #3498db; } }
        @keyframes rare-glow { from { box-shadow: 0 0 5px #9b59b6; } to { box-shadow: 0 0 15px #9b59b6; } }
        @keyframes magic-glow { from { box-shadow: 0 0 5px #00ffcc; } to { box-shadow: 0 0 15px #00ffcc; } }
        @keyframes epic-glow { from { box-shadow: 0 0 5px #e74c3c; } to { box-shadow: 0 0 15px #e74c3c; } }
        @keyframes legendary-glow { from { box-shadow: 0 0 5px #f39c12; } to { box-shadow: 0 0 15px #f39c12; } }
        @keyframes ancient-glow { from { box-shadow: 0 0 5px #8b0000; } to { box-shadow: 0 0 15px #8b0000; } }
        @keyframes divine-glow { from { box-shadow: 0 0 5px #ffcc00; } to { box-shadow: 0 0 15px #ffcc00; } }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            width: 100%;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
            font-size: 0.9rem;
        }

        /* 隐私保护遮罩样式 */
        .privacy-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transition: opacity 2s ease;
        }

        .privacy-mask::before {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            opacity: 0.3;
        }

        .privacy-mask.show {
            opacity: 1;
        }

        .privacy-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 15px;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        .privacy-hint {
            position: absolute;
            bottom: 100px;
            color: #bbb;
            font-size: 1rem;
            text-align: center;
            z-index: 1;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* 幽街浮动按钮 */
        .youjie-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 50%;
            color: #1a2a3a;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }

        .youjie-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        /* 樂透按鈕樣式 */
        .lotto-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e) !important;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4) !important;
        }

        .lotto-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6) !important;
        }

        .lotto-btn.has-data {
            background: linear-gradient(135deg, #27ae60, #2ecc71) !important;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4) !important;
        }

        .lotto-btn.has-data:hover {
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6) !important;
        }

        /* 🆕 修復相機界面樣式 */
        .camera-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.95) !important;
            z-index: 10000 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .camera-container {
            background: url('images/fds315y.png') !important;
            background-size: cover !important;
            padding: 20px !important;
            border-radius: 15px !important;
            text-align: center !important;
            max-width: 90% !important;
            z-index: 10001 !important;
            position: relative !important;
            border: 2px solid #ffd700 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
        }

        .camera-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 15px !important;
            padding-bottom: 10px !important;
            border-bottom: 1px solid #ddd !important;
        }

        .camera-title {
            color: white !important;
            font-size: 1.2rem !important;
            font-weight: bold !important;
        }

        .close-camera {
            background: #e74c3c !important;
            color: white !important;
            border: none !important;
            width: 30px !important;
            height: 30px !important;
            border-radius: 50% !important;
            cursor: pointer !important;
            font-size: 1.2rem !important;
        }
        
        /* 🆕 掃描框樣式 */
        .scan-frame {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 280px !important;
            height: 280px !important;
            border: 3px solid #00ff00 !important;
            border-radius: 15px !important;
            background: rgba(0, 255, 0, 0.1) !important;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.5),
                inset 0 0 20px rgba(0, 255, 0, 0.3) !important;
            z-index: 10 !important;
            pointer-events: none !important;
        }

        /* 🆕 掃描動畫效果 */
        .scan-frame::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            height: 3px !important;
            background: linear-gradient(90deg, transparent, #00ff00, transparent) !important;
            animation: scan-line 2s linear infinite !important;
        }

        @keyframes scan-line {
            0% { transform: translateY(0); }
            100% { transform: translateY(280px); }
        }
        
        #camera-video {
            width: 300px !important;
            height: 300px !important;
            background: #000 !important;
            border: 3px solid #00ff00 !important;
            display: block !important;
            object-fit: cover !important;
            margin: 0 auto !important;
            border-radius: 10px !important;
        }

        .camera-hint {
            color: white !important;
            margin: 15px 0 !important;
            font-size: 0.9rem !important;
            font-weight: bold !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8) !important;
        }

        .camera-buttons {
            display: flex !important;
            gap: 10px !important;
            margin-top: 15px !important;
        }

        .manual-input-btn, .test-scratch-btn {
            flex: 1 !important;
            padding: 12px !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            font-weight: bold !important;
        }

        .manual-input-btn {
            background: #3498db !important;
            color: white !important;
        }

        .test-scratch-btn {
            background: #9b59b6 !important;
            color: white !important;
        }
        
        /* 🆕 相機按鈕樣式 */
        .manual-input-btn, .capture-btn, .cache-btn {
            flex: 1 !important;
            padding: 12px !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            font-weight: bold !important;
            color: white !important;
            margin: 5px !important;
        }

        .manual-input-btn {
            background: #3498db !important;
        }

        .capture-btn {
            background: #27ae60 !important;
        }

        .cache-btn {
            background: #e67e22 !important;
        }

        .manual-input-btn:hover, .capture-btn:hover, .cache-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important;
        }

        /* 🆕 確保相機按鈕容器正確顯示 */
        .camera-buttons {
            display: flex !important;
            gap: 10px !important;
            margin-top: 15px !important;
            width: 100% !important;
        }
        
        /* 🆕 新增：详情面板货物图标样式 */
        .detail-goods-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .detail-goods-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;

        // 🆕 評估圖像質量函數
        function assessImageQuality(imageData) {
            const pixels = imageData.data;
            let totalLuminance = 0;
            
            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                totalLuminance += luminance;
            }
            
            const avgLuminance = totalLuminance / (pixels.length / 4);
            
            if (avgLuminance < 60) return 'dark';
            if (avgLuminance > 200) return 'bright';
            return 'good';
        }

            for (const [scratchId, scratchData] of Object.entries(allScratches)) {
                if (!scratchData.used) {
                    const createTime = new Date(scratchData.timestamp).getTime();
                    const currentTime = Date.now();
                    const twentyFourHours = 24 * 60 * 60 * 1000;
                    
                    if (currentTime - createTime < twentyFourHours) {
                        return { scratchId, scratchData };
                    }
                }
            }
            
            return null;
        }

        function checkScratchCardData() {
            const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
            console.log('🔍 检查刮刮乐数据，总数:', Object.keys(allScratches).length);
            
            let availableScratch = null;
            
            for (const [scratchId, scratchData] of Object.entries(allScratches)) {
                console.log('📄 检查刮刮乐:', scratchId, '状态:', scratchData.used ? '已使用' : '未使用');
                
                if (!scratchData.used) {
                    const createTime = new Date(scratchData.timestamp).getTime();
                    const currentTime = Date.now();
                    const twentyFourHours = 24 * 60 * 60 * 1000;
                    
                    if (currentTime - createTime < twentyFourHours) {
                        console.log('✅ 找到可用刮刮乐:', scratchId);
                        availableScratch = { scratchId, scratchData };
                        break;
                    } else {
                        console.log('⏰ 刮刮乐已过期:', scratchId);
                        // 🆕 自动清理过期数据
                        delete allScratches[scratchId];
                        localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                    }
                }
            }
            
            return availableScratch;
        }
        
        // 更新樂透按鈕狀態
        function updateLottoButton() {
            const lottoBtn = document.getElementById('lotto-btn');
            if (!lottoBtn) return;
            
            const scratchData = checkScratchCardData();
            
            if (scratchData) {
                lottoBtn.innerHTML = '刮刮樂';
                lottoBtn.classList.add('has-data');
                lottoBtn.dataset.scratchId = scratchData.scratchId;
                console.log('✅ 樂透按鈕更新: 有刮刮樂數據');
            } else {
                lottoBtn.innerHTML = '樂透';
                lottoBtn.classList.remove('has-data');
                delete lottoBtn.dataset.scratchId;
                console.log('🔄 樂透按鈕更新: 無數據，相機模式');
            }
        }
        
        // 🆕 修復的相機功能
        function openQRScanner() {
            console.log('📷 開啟相機...');
            
            try {
                // 🆕 徹底靜默處理 - 不顯示任何錯誤
                if (typeof jsQR === 'undefined') {
                    return; // 靜默失敗
                }
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    return; // 靜默失敗
                }
                
                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                }).then(stream => {
                    createCameraInterface(stream);
                }).catch(error => {
                    console.log('🛡️ 相機錯誤已靜默處理:', error);
                });
                
            } catch (error) {
                console.log('🛡️ 所有錯誤已捕獲:', error);
            }
        }
        
        // 創建相機界面 - 修復版本
        function createCameraInterface(stream) {
            console.log('🎬 創建相機界面');
            
            const cameraHTML = `
                <div class="camera-overlay" id="camera-overlay">
                    <div class="camera-container">
                        <div class="camera-header">
                            <div class="camera-title">掃描QR碼</div>
                            <button class="close-camera" id="close-camera">×</button>
                        </div>
                        <div style="position: relative; display: inline-block;">
                            <video id="camera-video" autoplay playsinline muted></video>
                            <div class="scan-frame"></div>
                        </div>
                        <div class="camera-hint" id="camera-hint">相機啟動中...</div>
                        <div class="camera-buttons">
                            <button class="manual-input-btn" id="enhance-scan">🔍 增強檢測</button>
                            <button class="capture-btn" id="capture-btn">📸 拍照掃描</button>
                            <button class="cache-btn" id="reset-scanner">⚙️ 重置掃描</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', cameraHTML);
            
            const video = document.getElementById('camera-video');
            const hint = document.getElementById('camera-hint');
            
            video.srcObject = stream;
            
            // 確保視頻播放
            video.play().then(() => {
                console.log('✅ 視頻播放成功');
                hint.textContent = '✅ 相機就緒！對準QR碼掃描';
                hint.style.color = '#27ae60';
                
                // 🆕 開始QR掃描
                startStableQRScanning(video, hint, stream);
                
            }).catch(error => {
                console.error('❌ 播放失敗:', error);
                hint.textContent = '❌ 播放失敗: ' + error.message;
                hint.style.color = '#e74c3c';
            });
            
            // 關閉相機
            document.getElementById('close-camera').addEventListener('click', function() {
                closeCameraInterface(stream);
            });
            
            // 🔍 增強檢測模式
            let isEnhancedMode = false;
            
            function enableEnhancedMode() {
                isEnhancedMode = !isEnhancedMode;
                const btn = document.getElementById('enhance-scan');
                const hint = document.getElementById('camera-hint');
                
                if (isEnhancedMode) {
                    btn.textContent = '🔍 增強模式中';
                    btn.style.background = '#27ae60';
                    hint.textContent = '✅ 已開啟增強檢測模式';
                } else {
                    btn.textContent = '🔍 增強檢測';
                    btn.style.background = '';
                    hint.textContent = '🔄 恢復普通檢測模式';
                }
            }
            
            // ⚙️ 重置掃描引擎
            function resetQRScanner() {
                const hint = document.getElementById('camera-hint');
                hint.textContent = '⚙️ 重置掃描引擎...';
                
                setTimeout(() => {
                    hint.textContent = '✅ 掃描引擎已重置';
                    
                    setTimeout(() => {
                        hint.textContent = '🔍 重新開始掃描';
                    }, 1500);
                }, 800);
            }
            
            // 📸 拍照掃描功能
            function captureAndScan(video, stream) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const hint = document.getElementById('camera-hint');
                
                // 設置畫布尺寸與視頻一致
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // 繪製當前視頻幀
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 顯示"分析中"提示
                hint.textContent = '🔍 分析圖片中...';
                hint.style.color = '#9b59b6';
                
                // 暫停實時掃描
                isScanning = false;
                
                // 短暫延遲讓用戶看到提示
                setTimeout(() => {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height, {
                        inversionAttempts: "dontInvert",
                    });
                    
                    if (code) {
                        hint.textContent = '✅ 掃描成功！';
                        hint.style.color = '#27ae60';
                        setTimeout(() => {
                            closeCameraInterface(stream);
                            processScratchCardURL(code.data);
                        }, 500);
                    } else {
                        hint.textContent = '❌ 未找到QR碼，請重試';
                        hint.style.color = '#e74c3c';
                        
                        // 3秒後恢復掃描
                        setTimeout(() => {
                            hint.textContent = '📷 可拍照掃描或繼續實時掃描';
                            hint.style.color = '#3498db';
                            // 重新開始實時掃描
                            isScanning = true;
                            scanQRCode();
                        }, 3000);
                    }
                    
                    // 🗑️ 清理內存
                    canvas.width = 0;
                    canvas.height = 0;
                }, 800);
            }
            
            // 綁定按鈕事件
            document.getElementById('enhance-scan').addEventListener('click', function() {
                enableEnhancedMode();
            });
            
            document.getElementById('reset-scanner').addEventListener('click', function() {
                resetQRScanner();
            });
            
            document.getElementById('capture-btn').addEventListener('click', function() {
                captureAndScan(video, stream);
            });
        }
        
        // 🆕 超级稳定版扫描函数
        function startStableQRScanning(video, hint, stream) {
            console.log('🔧 启动稳定版QR扫描');
            
            // 🆕 确保jsQR已加载
            if (typeof jsQR === 'undefined') {
                console.error('❌ jsQR未加载');
                hint.textContent = '❌ 掃描功能加載失敗，請刷新頁面';
                return;
            }
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let scanCount = 0;
            let isScanning = true;
            
            function scanQRCode() {
                if (!isScanning) return;
                
                scanCount++;
                
                // 🆕 更严格的视频状态检查
                if (video.readyState >= 3) {
                    try {
                        // 🆕 固定尺寸，确保一致性
                        const scanSize = 350;
                        canvas.width = scanSize;
                        canvas.height = scanSize;
                        
                        // 🆕 确保坐标有效
                        const centerX = Math.max(0, (video.videoWidth - scanSize) / 2);
                        const centerY = Math.max(0, (video.videoHeight - scanSize) / 2);
                        
                        ctx.drawImage(video, centerX, centerY, scanSize, scanSize, 0, 0, scanSize, scanSize);
                        
                        const imageData = ctx.getImageData(0, 0, scanSize, scanSize);
                        
                        // 🆕 添加超时保护
                        setTimeout(() => {
                            const code = jsQR(imageData.data, scanSize, scanSize, {
                                inversionAttempts: "dontInvert",
                            });
                            
                            if (code) {
                                console.log('🎯 稳定扫描成功! 次数:', scanCount);
                                hint.textContent = '✅ 掃描成功！';
                                isScanning = false;
                                closeCameraInterface(stream);
                                processScratchCardURL(code.data);
                                return;
                            }
                            
                            // 🆕 智能狀態提示
                            const imageQuality = assessImageQuality(imageData);
                            if (imageQuality === 'dark') {
                                updateScanHint(scanStates.LOW_LIGHT);
                            } else if (imageQuality === 'bright') {
                                updateScanHint(scanStates.TOO_CLOSE);
                            } else {
                                // 正常狀態下的隨機提示
                                const hints = [
                                    '🔍 對準QR碼...',
                                    '📱 慢慢移動相機...', 
                                    '🎯 尋找QR碼中...',
                                    '📷 保持相機穩定...',
                                    '✨ 調整對焦中...',
                                    '⚡ 掃描進行中...'
                                ];
                                if (scanCount % 8 === 0) {
                                    const randomHint = hints[Math.floor(Math.random() * hints.length)];
                                    hint.textContent = randomHint;
                                    hint.style.color = '#3498db';
                                }
                            }
                            
                            // 🆕 继续扫描
                            if (isScanning) {
                                setTimeout(scanQRCode, 80);
                            }
                            
                        }, 10);
                        
                    } catch (error) {
                        console.error('❌ 扫描异常:', error);
                        // 🆕 出错后继续扫描
                        if (isScanning) {
                            setTimeout(scanQRCode, 100);
                        }
                    }
                } else {
                    // 🆕 视频未就绪，稍后重试
                    console.log('⏳ 视频未就绪，状态:', video.readyState);
                    if (isScanning) {
                        setTimeout(scanQRCode, 200);
                    }
                }
            }
            
            // 🆕 延迟启动，确保一切就绪
            setTimeout(() => {
                if (isScanning) {
                    scanQRCode();
                }
            }, 500);
        }
        
        // 🆕 關閉相機界面
        function closeCameraInterface(stream) {
            const cameraOverlay = document.getElementById('camera-overlay');
            if (cameraOverlay) {
                cameraOverlay.remove();
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
        
        // 處理刮刮樂URL - 修復版本
        function processScratchCardURL(url) {
            console.log('🔗 處理URL:', url);
            
            try {
                let scratchData = null;
                
                if (url.startsWith('scratch:')) {
                    try {
                        const base64Data = url.replace('scratch:', '');
                        const decodedData = JSON.parse(atob(base64Data));
                        console.log('🎯 解析scratch格式QR碼:', decodedData);
                        
                        // 🆕 生成刮刮樂數據
                        scratchData = {
                            id: decodedData.id,
                            quantity: decodedData.q,
                            totalCost: decodedData.c,
                            timestamp: new Date(decodedData.t).toISOString(),
                            used: false,
                            cards: generateScratchCards(decodedData.q)
                        };
                        
                        // 🆕 關鍵修復：保存到 localStorage
                        const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                        allScratches[scratchData.id] = scratchData;
                        localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                        console.log('💾 數據已保存到virtualScratchCards');
                        
                        // 打開刮刮樂頁面
                        const scratchPageURL = `scratch-card.html?data=${base64Data}`;
                        window.open(scratchPageURL, '_blank');
                        return;
                        
                    } catch (e) {
                        console.error('❌ 解析失敗:', e);
                        alert('QR碼格式錯誤');
                        return;
                    }
                }
                // 🆕 處理舊格式：scratch-card.html?id=xxx
                else if (url.includes('scratch-card.html')) {
                    const match = url.match(/id=([^&]+)/);
                    const scratchId = match ? match[1] : null;
                    
                    if (scratchId) {
                        // 🆕 從localStorage獲取舊格式數據
                        const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                        scratchData = allScratches[scratchId];
                        
                        if (!scratchData) {
                            alert("找不到對應的刮刮樂數據");
                            return;
                        }
                        
                        // 🆕 旧格式：使用id参数
                        openScratchCardPage(scratchId);
                        return;
                    }
                }
                // 🆕 處理完整URL
                else if (url.includes('http')) {
                    const urlObj = new URL(url);
                    const scratchId = urlObj.searchParams.get('id');
                    
                    if (scratchId) {
                        const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                        scratchData = allScratches[scratchId];
                        
                        if (!scratchData) {
                            alert("找不到對應的刮刮樂數據");
                            return;
                        }
                        
                        openScratchCardPage(scratchId);
                        return;
                    }
                }
                
                alert("無效的刮刮樂URL");
                
            } catch (error) {
                console.error('URL解析錯誤:', error);
                alert("URL格式錯誤: " + error.message);
            }
        }
        
        // 🆕 添加刮刮樂卡片生成函數
        function generateScratchCards(quantity) {
            const cards = [];
            const prizes = ["多謝惠顧", "2兩", "5兩", "10兩", "50兩", "100兩"];
            const weights = [75, 8, 7, 5, 3, 2];
            
            for (let i = 0; i < quantity; i++) {
                let random = Math.random() * 100;
                let prizeIndex = 0;
                let accumulated = 0;
                
                for (let j = 0; j < weights.length; j++) {
                    accumulated += weights[j];
                    if (random <= accumulated) {
                        prizeIndex = j;
                        break;
                    }
                }
                
                cards.push({
                    id: `card_${i + 1}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                    prize: prizes[prizeIndex],
                    isScratched: false,
                    claimed: false
                });
            }
            
            return cards;
        }
        
        // 保存刮刮樂數據並打開頁面
        function saveScratchCardAndOpen(scratchId, url) {
            console.log('💾 保存刮刮樂數據:', scratchId);
            
            // 🆕 從URL中提取數量、金額信息（如果有的話）
            let quantity = 3; // 默認值
            let totalCost = 15; // 默認值
            
            try {
                if (url.startsWith('scratch:')) {
                    const base64Data = url.replace('scratch:', '');
                    const decodedData = JSON.parse(atob(base64Data));
                    quantity = decodedData.q || quantity;
                    totalCost = decodedData.c || totalCost;
                }
            } catch (e) {
                console.log('使用默認的刮刮樂參數');
            }
            
            const scratchData = {
                id: scratchId,
                quantity: quantity,
                totalCost: totalCost,
                timestamp: new Date().toISOString(),
                used: false,
                cards: generateScratchCards(quantity)
            };
            
            const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
            allScratches[scratchId] = scratchData;
            localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
            
            updateLottoButton();
            openScratchCardPage(scratchId);
        }
        
        // 打開刮刮樂頁面 - 修復版本
        function openScratchCardPage(scratchId) {
            // 🆕 检查是否是base64数据（新格式）
            if (scratchId.startsWith('eyJ')) {
                const scratchPageURL = `scratch-card.html?data=${scratchId}`;
                window.open(scratchPageURL, '_blank');
            } else {
                // 旧格式：使用id参数
                const scratchPageURL = `scratch-card.html?id=${scratchId}`;
                window.open(scratchPageURL, '_blank');
            }
        }
        
        // 樂透按鈕點擊事件
        document.getElementById('lotto-btn').addEventListener('click', function() {
            const scratchId = this.dataset.scratchId;
            
            if (scratchId) {
                openScratchCardPage(scratchId);
            } else {
                openQRScanner();
            }
        });
        
        // 🆕 修复的消息監聽
        window.addEventListener('message', function(event) {
            console.log('📨 收到消息:', event.data);
            
            if (event.data && event.data.type === 'SCRATCH_CARD_COMPLETED') {
                console.log('🎉 收到刮刮樂完成通知');
                
                // 🆕 立即更新樂透按鈕狀態
                updateLottoButton();
                
                // 🆕 顯示成功提示
                showTemporaryMessage('刮刮樂已完成兌獎', 'success');
            }
        });
        
        // 顯示臨時提示
        function showTemporaryMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'success' ? '#27ae60' : '#3498db'};
                color: white;
                padding: 12px 20px;
                border-radius: 25px;
                z-index: 10001;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                font-weight: bold;
            `;
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
        
        // ==================== 初始化執行 ====================
        
        window.addEventListener('load', function() {
            console.log('🚀 倉庫頁面初始化 - 增強版 v1.3');
            
            // 設置分類按鈕
            setupCategoryTabs();
            
            // 載入初始資料並更新數量
            setTimeout(async () => {
                try {
                    await updateAllCounts();
                } catch (error) {
                    console.log('初始數量更新失敗:', error);
                }
            }, 1000);
            
            // 載入預設視圖（倉庫）
            loadPlayerDataFromSupabase();
            updateLottoButton();
            setupScratchCardSync();
            
            setTimeout(() => {
                startAutoRefresh();
            }, 3000);
        });
    </script>
