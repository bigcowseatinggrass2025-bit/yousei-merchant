<!DOCTYPE html>
<html lang="zh">
<head>

    <style>
        /* 手机端专用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
       body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: 
        linear-gradient(rgba(26, 42, 58, 0.7), rgba(44, 62, 80, 0.7)),
        url('images/hbgvdfh53.png') no-repeat center center fixed;
    background-size: cover;
    color: white;
    min-height: 100vh;
    padding: 20px;
}
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .player-name {
            font-size: 1.3rem;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .last-updated {
            font-size: 0.9rem;
            color: #bbb;
        }
        
        /* 筛选标签样式 */
        .filter-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-tab {
            flex: 0 0 auto;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .filter-tab.active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        
        /* 详情面板 */
        .detail-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            display: none;
        }
        
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .detail-title {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: bold;
        }
        
        .close-detail {
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .detail-goods {
            grid-column: 1 / -1;
        }
        
        .goods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .goods-tag {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .price-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* 货卡网格布局 - 每行3张卡片 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .warehouse-card {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .warehouse-card:hover {
            transform: translateY(-2px);
        }
        
        /* 稀有度边框颜色 */
        .warehouse-card.ghost { 
            border-color: #3498db;
            animation: ghost-glow 2s infinite alternate;
        }
        .warehouse-card.fairy { 
            border-color: #9b59b6;
            animation: fairy-glow 2s infinite alternate;
        }
        .warehouse-card.immortal { 
            border-color: #00ffcc;
            animation: immortal-glow 1.8s infinite alternate;
        }
        .warehouse-card.king { 
            border-color: #8b0000;
            animation: king-dark-glow 1.5s infinite alternate;
        }
        .warehouse-card.celestial { 
            border-color: #ffcc00;
            animation: celestial-glow 1.2s infinite alternate;
        }
        
        .card-name {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.85rem;
            line-height: 1.2;
        }
        
        .card-goods {
            display: flex;
            justify-content: center;
            gap: 3px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .goods-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.65rem;
        }
        
        .card-prices {
            font-size: 0.7rem;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .card-rarity {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        
        /* 货物颜色 */
        .goods-fanhuo { background: #27ae60; }
        .goods-wenwan { background: #9b59b6; }
        .goods-yishou { background: #2980b9; }
        .goods-yantie { background: #3498db; }
        .goods-huoqi { background: #e74c3c; }
        .goods-qiwu { background: #f39c12; }
        
        /* 发光动画 */
        @keyframes ghost-glow {
            from { box-shadow: 0 0 5px #3498db; }
            to { box-shadow: 0 0 15px #3498db, 0 0 25px #3498db; }
        }
        
        @keyframes fairy-glow {
            from { box-shadow: 0 0 5px #9b59b6; }
            to { box-shadow: 0 0 15px #9b59b6, 0 0 25px #9b59b6; }
        }
        
        @keyframes immortal-glow {
            from { box-shadow: 0 0 5px #00ffcc; }
            to { box-shadow: 0 0 15px #00ffcc, 0 0 25px #00ff99, 0 0 35px #00ffcc; }
        }
        
        @keyframes king-dark-glow {
            from { box-shadow: 0 0 5px #8b0000; }
            to { box-shadow: 0 0 15px #8b0000, 0 0 30px #ff0000, 0 0 45px #8b0000; }
        }
        
        @keyframes celestial-glow {
            from { box-shadow: 0 0 5px #ffffff; }
            to { box-shadow: 0 0 20px #ffffff, 0 0 40px #ffff00, 0 0 60px #ffffff; }
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            width: 100%;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #bbb;
            font-size: 0.9rem;
        }

        /* 隐私保护遮罩样式 */
        .privacy-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a3a, #0d1b2a);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            opacity: 0;
            transition: opacity 2s ease;
        }

        .privacy-mask::before {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            opacity: 0.3;
        }

        .privacy-mask.show {
            opacity: 1;
        }

        .privacy-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 15px;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        .privacy-hint {
            position: absolute;
            bottom: 100px;
            color: #bbb;
            font-size: 1rem;
            text-align: center;
            z-index: 1;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* 幽街浮动按钮 */
        .youjie-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 50%;
            color: #1a2a3a;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);

        }

        .youjie-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        /* 樂透按鈕樣式 */
        .lotto-btn {
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e) !important;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4) !important;
        }

        .lotto-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6) !important;
        }

        .lotto-btn.has-data {
            background: linear-gradient(135deg, #27ae60, #2ecc71) !important;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4) !important;
        }

        .lotto-btn.has-data:hover {
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6) !important;
        }

        /* 🆕 修復相機界面樣式 */
        .camera-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.95) !important;
            z-index: 10000 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .camera-container {
            background: white !important;
            padding: 20px !important;
            border-radius: 15px !important;
            text-align: center !important;
            max-width: 90% !important;
            z-index: 10001 !important;
            position: relative !important;
        }

        .camera-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 15px !important;
            padding-bottom: 10px !important;
            border-bottom: 1px solid #ddd !important;
        }

        .camera-title {
            color: black !important;
            font-size: 1.2rem !important;
            font-weight: bold !important;
        }

        .close-camera {
            background: #e74c3c !important;
            color: white !important;
            border: none !important;
            width: 30px !important;
            height: 30px !important;
            border-radius: 50% !important;
            cursor: pointer !important;
            font-size: 1.2rem !important;
        }

       #camera-video {
    width: 300px !important;
    height: 300px !important;
    background: #000 !important;
    border: 3px solid #00ff00 !important;
    display: block !important;
    object-fit: cover !important;
    margin: 0 auto !important;
    border-radius: 10px !important;
}

        .camera-hint {
            color: black !important;
            margin: 15px 0 !important;
            font-size: 0.9rem !important;
        }

        .camera-buttons {
            display: flex !important;
            gap: 10px !important;
            margin-top: 15px !important;
        }

        .manual-input-btn, .test-scratch-btn {
            flex: 1 !important;
            padding: 12px !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            font-weight: bold !important;
        }

        .manual-input-btn {
            background: #3498db !important;
            color: white !important;
        }

        .test-scratch-btn {
            background: #9b59b6 !important;
            color: white !important;
        }
    </style>
</head>

    <script>
        // 🎯 在脚本最顶部创建Supabase客户端
        const SUPABASE_URL = 'https://yfjvwwkelkvnlcdyqeck.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6OMKW1OxdLUhY3U3VGEYcQ_JIfFrFOP';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 从URL获取玩家信息
        const urlParams = new URLSearchParams(window.location.search);

        // 显示玩家信息
        document.getElementById('player-name').textContent = playerName;
        document.getElementById('last-updated').textContent = '最後更新: ' + new Date().toLocaleString();

        let currentCards = [];
        
        // 货物名称映射
        const goodsNameMapping = {
            "番": "番貨",
            "文": "文玩", 
            "異": "異獸",

        };

        document.getElementById('youjie-btn').addEventListener('click', function() {

        // 🧹 清理函数
        async function cleanupExpiredWarehouses() {
            try {
                const 四小时前 = new Date(Date.now() - 4 * 60 * 60 * 1000);
                
                const { error } = await supabaseClient
                    .from('player_warehouses')
                    .delete()
                    .lt('created_at', 四小时前.toISOString());
                
                if (!error) {
                    console.log('🧹 已清理4小时前的过期仓库数据');
                }
            } catch (error) {
                console.log('清理数据时出错:', error);
            }
        }

        // ==================== 刮刮樂功能 ====================

        // 檢查是否有可用的刮刮樂數據
        function checkScratchCardData() {
            const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
            
            for (const [scratchId, scratchData] of Object.entries(allScratches)) {
                if (!scratchData.used) {
                    const createTime = new Date(scratchData.timestamp).getTime();
                    const currentTime = Date.now();
                    const twentyFourHours = 24 * 60 * 60 * 1000;
                    
                    if (currentTime - createTime < twentyFourHours) {
                        return { scratchId, scratchData };
                    }
                }
            }
            
            return null;
        }

        // 更新樂透按鈕狀態
        function updateLottoButton() {
            const lottoBtn = document.getElementById('lotto-btn');
            if (!lottoBtn) return;
            
            const scratchData = checkScratchCardData();
            
            if (scratchData) {
                lottoBtn.innerHTML = '刮刮樂';
                lottoBtn.classList.add('has-data');
                lottoBtn.dataset.scratchId = scratchData.scratchId;
                console.log('✅ 樂透按鈕更新: 有刮刮樂數據');
            } else {
                lottoBtn.innerHTML = '樂透';
                lottoBtn.classList.remove('has-data');
                delete lottoBtn.dataset.scratchId;
                console.log('🔄 樂透按鈕更新: 無數據，相機模式');
            }
        }

       // 🆕 修復的相機功能
function openQRScanner() {
    console.log('📷 開啟相機...');
    
    if (typeof jsQR === 'undefined') {
        alert('❌ jsQR庫未加載，請刷新頁面');
        return;
    }
    
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('您的瀏覽器不支持相機功能');
        return;
    }

    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
        }
    }).then(stream => {
        createCameraInterface(stream);
    }).catch(error => {
        console.error('❌ 相機錯誤:', error);
        let errorMsg = "無法訪問相機：";
        if (error.name === 'NotAllowedError') {
            errorMsg += "請允許相機權限";
        } else if (error.name === 'NotFoundError') {
            errorMsg += "找不到相機設備";
        } else {
            errorMsg += error.message;
        }
        alert(errorMsg);
    });
}
      
        // 創建相機界面 - 修復版本
function createCameraInterface(stream) {
    console.log('🎬 創建相機界面');
    
    const cameraHTML = `
        <div class="camera-overlay" id="camera-overlay">
            <div class="camera-container">
                <div class="camera-header">
                    <div class="camera-title">掃描QR碼</div>
                    <button class="close-camera" id="close-camera">×</button>
                </div>
                <div style="position: relative; display: inline-block;">
                    <video id="camera-video" autoplay playsinline muted></video>
                    <div class="scan-frame"></div>
                </div>
                <div class="camera-hint" id="camera-hint">相機啟動中...</div>
                <div class="camera-buttons">
                    <button class="manual-input-btn" id="manual-input-btn">手動輸入URL</button>
                    <button class="capture-btn" id="capture-btn">📸 拍照掃描</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', cameraHTML);
    
    const video = document.getElementById('camera-video');
    const hint = document.getElementById('camera-hint');
    
    video.srcObject = stream;
    
    // 確保視頻播放
    video.play().then(() => {
        console.log('✅ 視頻播放成功');
        hint.textContent = '✅ 相機就緒！對準QR碼掃描';
        hint.style.color = '#27ae60';
        
        // 🆕 開始QR掃描
        startStableQRScanning(video, hint, stream);
        
    }).catch(error => {
        console.error('❌ 播放失敗:', error);
        hint.textContent = '❌ 播放失敗: ' + error.message;
        hint.style.color = '#e74c3c';
    });
    
    // 關閉相機
    document.getElementById('close-camera').addEventListener('click', function() {
        closeCameraInterface(stream);
    });

function startStableQRScanning(video, hint, stream) {

    // 🆕 确保jsQR已加载
    if (typeof jsQR === 'undefined') {
        console.error('❌ jsQR未加载');

        return;
    }
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let scanCount = 0;
    let isScanning = true;
    
    function scanQRCode() {
        if (!isScanning) return;
        
        scanCount++;
        
        // 🆕 更严格的视频状态检查
        if (video.readyState >= 3) { // HAVE_FUTURE_DATA 或 HAVE_ENOUGH_DATA
           try {
    // 🆕 固定尺寸，确保一致性
    const scanSize = 350;
    canvas.width = scanSize;
    canvas.height = scanSize;
    
    // 🆕 确保坐标有效
    const centerX = Math.max(0, (video.videoWidth - scanSize) / 2);
    const centerY = Math.max(0, (video.videoHeight - scanSize) / 2);
    
    ctx.drawImage(video, centerX, centerY, scanSize, scanSize, 0, 0, scanSize, scanSize);
    
    const imageData = ctx.getImageData(0, 0, scanSize, scanSize);
    
    // 🆕 添加超时保护
    setTimeout(() => {
        const code = jsQR(imageData.data, scanSize, scanSize, {
            inversionAttempts: "dontInvert",
        });
        
        if (code) {
            console.log('🎯 稳定扫描成功! 次数:', scanCount);
            hint.textContent = '✅ 掃描成功！';
            hint.style.color = '#27ae60';
            isScanning = false;
            closeCameraInterface(stream);
            processScratchCardURL(code.data);
            return;
        }
        
        // 🆕 智能状态提示
        const imageQuality = assessImageQuality(imageData);
        if (imageQuality === 'dark') {
            hint.textContent = '💡 光線不足，請調亮環境';
            hint.style.color = '#f39c12';
        } else if (imageQuality === 'blurry') {
            hint.textContent = '📱 設備移動中，請保持穩定';
            hint.style.color = '#e67e22';
        } else if (imageQuality === 'bright') {
            hint.textContent = '🔆 光線太強，請調整角度';
            hint.style.color = '#f39c12';
        } else {
            // 正常狀態下的隨機提示
            const hints = [
                '🔍 對準QR碼...',
                '📱 慢慢移動相機...', 
                '🎯 尋找QR碼中...',
                '📷 保持相機穩定...',
                '✨ 調整對焦中...',
                '⚡ 掃描進行中...'
            ];
            if (scanCount % 8 === 0) {
                const randomHint = hints[Math.floor(Math.random() * hints.length)];
                hint.textContent = randomHint;
            }
        }
        
        // 確保正常狀態為藍色
        if (!hint.style.color || hint.style.color === 'rgb(52, 152, 219)') {
            hint.style.color = '#3498db';
        }
        
        // 🆕 继续扫描
        if (isScanning) {
            setTimeout(scanQRCode, 80);
        }
        
    }, 10); // 小延迟避免阻塞
    
} catch (error) {
    console.error('扫描错误:', error);

        setTimeout(scanQRCode, 100);
    }
}
}

       // 🆕 評估圖像質量函數
function assessImageQuality(imageData) {
    const pixels = imageData.data;
    let totalLuminance = 0;
    let contrast = 0;
    
    // 計算平均亮度
    for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i + 1]; 
        const b = pixels[i + 2];
        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
        totalLuminance += luminance;
    }
    
    const avgLuminance = totalLuminance / (pixels.length / 4);
    
    // 簡單的圖像質量判斷
    if (avgLuminance < 60) return 'dark';
    if (avgLuminance > 200) return 'bright';
    
    // 檢查對比度（簡單版本）
    let darkCount = 0, brightCount = 0;
    for (let i = 0; i < pixels.length; i += 4) {
        const luminance = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
        if (luminance < 80) darkCount++;
        if (luminance > 180) brightCount++;
    }
    
    const contrastRatio = (brightCount + darkCount) / (pixels.length / 4);
    if (contrastRatio < 0.3) return 'blurry';
    
    return 'good';
}     

function processScratchCardURL(url) {
    console.log('🔗 處理URL:', url);
    
    try {
        let scratchData = null;
        
        if (url.startsWith('scratch:')) {
            try {
                const base64Data = url.replace('scratch:', '');
                const decodedData = JSON.parse(atob(base64Data));
                console.log('🎯 解析scratch格式QR碼:', decodedData);
                
                // 🆕 生成刮刮樂數據
                scratchData = {
                    id: decodedData.id,
                    quantity: decodedData.q,
                    totalCost: decodedData.c,
                    timestamp: new Date(decodedData.t).toISOString(),
                    used: false,
                    cards: generateScratchCards(decodedData.q)
                };
                
                // 🆕 關鍵修復：保存到 localStorage
                const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                allScratches[scratchData.id] = scratchData;
                localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
                console.log('💾 數據已保存到virtualScratchCards');
                
                // 打開刮刮樂頁面
                const scratchPageURL = `scratch-card.html?data=${base64Data}`;
                window.open(scratchPageURL, '_blank');
                return;
                
            } catch (e) {
                console.error('❌ 解析失敗:', e);
                alert('QR碼格式錯誤');
                return;
            }
        }
        // 🆕 處理舊格式：scratch-card.html?id=xxx
        else if (url.includes('scratch-card.html')) {
            const match = url.match(/id=([^&]+)/);
            const scratchId = match ? match[1] : null;
            
            if (scratchId) {
                // 🆕 從localStorage獲取舊格式數據
                const allScratches = JSON.parse(localStorage.getItem('virtualScratchCards') || '{}');
                scratchData = allScratches[scratchId];
                
                if (!scratchData) {
                    alert("找不到對應的刮刮樂數據");
                    return;
                }
                
                // 🆕 旧格式：使用id参数
                openScratchCardPage(scratchId);
                return;
            }
        }
        
        alert("無效的刮刮樂URL");
        
    } catch (error) {  // 🆕 添加這個 catch
        console.error('URL解析錯誤:', error);
        alert("URL格式錯誤: " + error.message);
    }
}

function generateScratchCards(quantity) {
    const cards = [];
    const prizes = ["多謝惠顧", "2兩", "5兩", "10兩", "50兩", "100兩"];
    const weights = [75, 8, 7, 5, 3, 2];
    
    for (let i = 0; i < quantity; i++) {
        let random = Math.random() * 100;
        let prizeIndex = 0;
        let accumulated = 0;
        
        for (let j = 0; j < weights.length; j++) {
            accumulated += weights[j];
            if (random <= accumulated) {
                prizeIndex = j;
                break;
            }
        }
        
        cards.push({
            id: `card_${i + 1}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
            prize: prizes[prizeIndex],
            isScratched: false,
            claimed: false
        });
    }
    
    return cards;
}

                // 🆕 自动清理过期数据
                delete allScratches[scratchId];
                localStorage.setItem('virtualScratchCards', JSON.stringify(allScratches));
            }
        }
    }
    
    return availableScratch;
}

// 🆕 增强的乐透按钮更新函数
function updateLottoButton() {
    const lottoBtn = document.getElementById('lotto-btn');
    if (!lottoBtn) {
        console.log('❌ 乐透按钮未找到');
        return;
    }
    
    const scratchData = checkScratchCardData();
    console.log('🔄 更新乐透按钮，找到数据:', scratchData ? '是' : '否');
    
    if (scratchData) {
        lottoBtn.innerHTML = '🎫 刮刮樂';
        lottoBtn.classList.add('has-data');
        lottoBtn.dataset.scratchId = scratchData.scratchId;
        console.log('✅ 乐透按钮更新: 有刮刮乐数据');
    } else {
        lottoBtn.innerHTML = '📷 掃QR碼';
        lottoBtn.classList.remove('has-data');
        delete lottoBtn.dataset.scratchId;
        console.log('🔄 乐透按钮更新: 无数据，相机模式');
    }
}

// 🆕 添加页面焦点事件监听
window.addEventListener('focus', function() {
    console.log('🎯 页面获得焦点，更新刮刮乐状态');
    setTimeout(() => {
        updateLottoButton();
    }, 300);
});

// 🆕 添加beforeunload事件，确保离开时状态正确
window.addEventListener('beforeunload', function() {
    console.log('🚪 页面即将卸载，保存状态');
    // 触发storage事件通知其他页面
    localStorage.setItem('warehouseLastActivity', Date.now().toString());
});

        

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // 刷新按鈕事件
        document.getElementById('refresh-btn').addEventListener('click', function() {
            loadPlayerDataFromSupabase();
        });

        // 頁面可見性控制
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        });

       // 初始化
window.addEventListener('load', function() {
    console.log('🚀 仓库页面初始化');
    
    loadPlayerDataFromSupabase();
    updateLottoButton(); // 🆕 确保初始状态正确
    setupScratchCardSync(); // 🆕 启动状态同步
    
    setTimeout(() => {
        startAutoRefresh();
    }, 3000);
    
    // 🆕 页面显示时立即检查状态
    setTimeout(() => {
        updateLottoButton();
    }, 1000);
});
    </script>
</body>
