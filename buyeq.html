<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幽街商人 - 藏品铺</title>
    <style>
        /* 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        }

       

        

       .login-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: url('https://imgur.com/oHmeO93.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

        .login-background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* 页面布局与背景 */
        body {
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease-in-out;
        }

        /* 登录时的背景 */
        body.login-bg {
            background: rgba(0, 0, 0, 0.7);
        }

        /* 藏品铺时的背景 */
        body.collection-bg {
            background: transparent;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 1;
        }
		
		/* 藏品铺背景 */
.collection-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background-image: url('https://imgur.com/pIDcXco.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.collection-background-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: -1;
}

        /* 标题区域 */
        header {
            background: linear-gradient(135deg, #2c1a1d, #3a2634, #2d1b3d);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #8a6d3b;
            position: relative;
            overflow: hidden;
        }

        .header-glow::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(45deg, 
        rgba(138, 109, 59, 0.3), 
        rgba(192, 156, 99, 0.4), 
        rgba(138, 109, 59, 0.3),
        rgba(101, 67, 33, 0.4));
    background-size: 400% 400%;
    animation: mysterious-glow 8s ease-in-out infinite;
    z-index: 0;
    opacity: 0.7;
    filter: blur(8px);
}

        .header-glow h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    background: linear-gradient(135deg, 
        #e6d3a3, 
        #d4b483, 
        #c19e6b, 
        #a88454, 
        #8a6d3b);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: antique-gold 6s ease-in-out infinite;
    position: relative;
    z-index: 1;
}

        @keyframes mysterious-glow {
    0%, 100% { 
        background-position: 0% 50%;
        opacity: 0.5;
    }
    25% { 
        background-position: 50% 50%;
        opacity: 0.7;
    }
    50% { 
        background-position: 100% 50%;
        opacity: 0.5;
    }
    75% { 
        background-position: 50% 50%;
        opacity: 0.7;
    }
}

@keyframes antique-gold {
    0%, 100% { 
        background-position: 0% 50%;
        text-shadow: 0 0 10px rgba(230, 211, 163, 0.5);
    }
    25% { 
        background-position: 50% 50%;
        text-shadow: 0 0 15px rgba(212, 180, 131, 0.7);
    }
    50% { 
        background-position: 100% 50%;
        text-shadow: 0 0 20px rgba(193, 158, 107, 0.8);
    }
    75% { 
        background-position: 50% 50%;
        text-shadow: 0 0 15px rgba(212, 180, 131, 0.7);
    }
}

        .header-glow .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            color: #d4b483;
            animation: subtitle-glow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }
		
		
		/* 易价模态框自定义背景 */
.bargain-modal-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    border-radius: 15px;
    overflow: hidden;
    background-image: url('https://i.imgur.com/tU2dNoO.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.3;
}



        /* 音效控制按钮 */
        .sound-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #FFD700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
        }

        .sound-control:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(1.1);
        }

        .sound-control.muted {
            opacity: 0.5;
        }

        .sound-control.muted span {
            text-decoration: line-through;
        }

        /* 动画效果 */
        @keyframes rainbow-glow {
            0%, 100% { 
                opacity: 0.3;
                background-position: 0% 50%;
            }
            50% { 
                opacity: 0.8;
                background-position: 100% 50%;
            }
        }

        @keyframes rainbow-text {
            0%, 100% { 
                background-position: 0% 50%;
                text-shadow: 0 0 10px rgba(255,255,255,0.5);
            }
            50% { 
                background-position: 100% 50%;
                text-shadow: 0 0 20px rgba(255,255,255,0.8);
            }
        }

        @keyframes subtitle-glow {
            from { 
                text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700;
            }
            to { 
                text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 30px #FFD700;
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor; }
            50% { text-shadow: 0 0 10px currentColor, 0 0 15px currentColor; }
            100% { text-shadow: 0 0 5px currentColor, 0 0 10px currentColor; }
        }

        /* 登录区域 */
        .login-section {
            padding: 30px;
            text-align: center;
            display: block;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .player-select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #FFD700;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .verifying-text {
            color: #ff4444;
            font-size: 1.1rem;
            margin: 15px 0;
            text-align: center;
            display: none;
            animation: blink 1.5s ease-in-out infinite;
        }

        /* 欢迎消息样式 */
        .welcome-text {
            font-size: 1.3rem;
            margin: 20px 0;
            text-align: center;
            animation: welcome-glow 2s ease-in-out infinite;
        }

        .rainbow-text {
            background: linear-gradient(45deg, 
                #ff0000, #ff9900, #ffff00, #00ff00, 
                #00ffff, #0000ff, #9900ff, #ff00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-text 3s ease-in-out infinite;
            font-weight: bold;
        }

        .welcome-subtext {
            font-size: 1rem;
            color: #FFD700;
            margin-top: 5px;
            display: block;
            animation: subtitle-glow 2s ease-in-out infinite alternate;
        }

        /* 欢迎消息的发光动画 */
        @keyframes welcome-glow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(255,255,255,0.5),
                             0 0 20px rgba(255,215,0,0.3);
            }
            50% { 
                text-shadow: 0 0 15px rgba(255,255,255,0.8),
                             0 0 30px rgba(255,215,0,0.6),
                             0 0 40px rgba(255,100,100,0.4);
            }
        }

        /* 藏品铺内容区域 */
        .collection-content {
            display: none;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 为藏品铺内容添加独立的视频背景 */
        .collection-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            border-radius: 0 0 15px 15px;
        }

        .collection-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
            border-radius: 0 0 15px 15px;
        }

       .collection-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* 从0.7改为0.5，让背景更清晰 */
    z-index: -2;
    border-radius: 0 0 15px 15px;
}

        .player-info {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .player-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            position: relative;
        }

        /* 发光计数器 */
        #spirit-stone-count {
            animation: glow 2s ease-in-out infinite;
            font-weight: bold;
            color: #3498db;
            text-shadow: 0 0 8px #3498db, 0 0 12px #3498db;
        }

        /* 货架样式 */
        .shelf-container {
            margin: 20px 0;
        }

        .shelf {
            background: rgba(139, 69, 19, 0.7);
            border: 2px solid #8B4513;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .shelf-title {
            text-align: center;
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
		
		
		/* 特殊發光效果 - 屬性總和超過15 */
.item-card.special-glow {
    border: 3px solid transparent;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 100, 100, 0.2), rgba(100, 100, 255, 0.2));
    background-clip: padding-box;
    position: relative;
    animation: special-glow-animation 3s ease-in-out infinite alternate;
}

.item-card.special-glow::before {
    content: '';
    position: absolute;
    top: -3px;
    left: -3px;
    right: -3px;
    bottom: -3px;
    background: linear-gradient(45deg, 
        #ff0000, #ff9900, #ffff00, #00ff00, 
        #00ffff, #0000ff, #9900ff, #ff00ff);
    background-size: 400% 400%;
    border-radius: 11px;
    z-index: -1;
    animation: rainbow-border 4s linear infinite;
    filter: blur(2px);
}

.item-card.special-glow .item-name {
    background: linear-gradient(45deg, 
        #ff0000, #ff9900, #ffff00, #00ff00, 
        #00ffff, #0000ff, #9900ff, #ff00ff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbow-text 3s linear infinite;
    font-weight: bold;
}

/* 特殊發光動畫 */
@keyframes special-glow-animation {
    0%, 100% {
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.5),
                    0 0 20px rgba(255, 100, 0, 0.3),
                    0 0 30px rgba(255, 200, 0, 0.2);
    }
    50% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.5),
                    0 0 25px rgba(0, 200, 255, 0.3),
                    0 0 35px rgba(100, 0, 255, 0.2);
    }
}

@keyframes rainbow-border {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes rainbow-text {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

        /* 货品样式 */
        .item-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .item-card:hover {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            transform: translateY(-5px);
        }

        .item-image {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #FFD700;
        }

        .item-description {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #ccc;
        }

        .item-bonuses {
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        .item-special {
            font-size: 0.8rem;
            margin-bottom: 10px;
            color: #ff9900;
            font-style: italic;
        }

        .item-price {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .price-silver {
            color: #C0C0C0;
        }

        .price-spirit {
            color: #3498db;
        }

        .buy-buttons {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        /* 分页控制 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.95), rgba(52, 73, 94, 0.95));
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border: 2px solid #FFD700;
            backdrop-filter: blur(10px);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #FFD700;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* 易价对话框样式 */
        .bargain-dialog {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }

        .bargain-options {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bargain-option {
            padding: 8px 15px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #FFD700;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bargain-option:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        .bargain-remaining {
            text-align: center;
            margin-top: 10px;
            color: #FFD700;
        }

       /* 易價物品圖片大小調整 */
.bargain-item-image {
    width: 120px;  /* 從80px增加到120px */
    height: 120px; /* 從80px增加到120px */
    object-fit: contain;
    border-radius: 8px;
    border: 2px solid #8a6d3b;
}

/* 易價物品信息佈局調整 */
.bargain-item-info {
    display: flex;
    align-items: center;
    gap: 20px; /* 從15px增加到20px */
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
}

.bargain-item-details {
    flex: 1;
    text-align: left;
}

.bargain-item-details p {
    margin-bottom: 8px;
    font-size: 1.1rem;
}

#bargain-item-name {
    font-size: 1.3rem;
    font-weight: bold;
    color: #FFD700;
}

#bargain-item-price {
    font-size: 1.1rem;
    color: #3498db;
}

        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        .btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .shelf {
                grid-template-columns: 1fr;
            }
            
            .player-stats {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-glow h1 {
                font-size: 2rem;
            }
            
            .bargain-options {
                flex-direction: column;
            }
            
            .bargain-item-info {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>

<body>
    <!-- 音效控制按钮 -->
    <div class="sound-control" id="sound-control">
        <span>🔊</span>
    </div>
    
    <!-- 登录背景（初始显示） -->
    <div class="login-background"></div>
    <div class="login-background-overlay"></div>

    <!-- 藏品铺背景（初始隐藏） -->
    <div class="collection-background" style="display: none;"></div>
    <div class="collection-background-overlay" style="display: none;"></div>

    <div class="container">
        <header class="header-glow">
            <h1>幽街商人 - 藏品铺</h1>
            <p class="subtitle">珍稀装备 • 靈寵坐騎 • 武器服飾</p>
        </header>
        
        <!-- 登录区域 -->
        <section class="login-section" id="login-section">
            <h2>選擇登錄玩家</h2>
            <select class="player-select" id="player-select">
                <option value="">-- 請選擇玩家 --</option>
            </select>
            <button class="btn btn-primary" id="login-btn">進入藏品铺</button>
            
            <!-- 添加身份验证文字 -->
            <div class="verifying-text" id="verifying-text">
                <strong>‍客官，稍等一下 </strong>
            </div>
            
            <!-- 新增欢迎消息 -->
            <div class="welcome-text" id="welcome-text" style="display: none;">
                <strong>喔，原來是<span id="welcome-player-name" class="rainbow-text"></span> 歡迎光臨！</strong>
                <br>
                <span class="welcome-subtext">正在進入藏品铺‍</span>
            </div>
        </section>
        
        <!-- 藏品铺内容 -->
        <section class="collection-content" id="collection-content">
            <div class="player-info">
                <h2 id="current-player">玩家名稱</h2>
                <div class="player-stats">
                    <div class="stat-item">靈石: <span id="spirit-stone-count">0</span></div>
                </div>
            </div>
            
            <!-- 货架区域 -->
            <div class="shelf-container" id="shelf-container">
                <!-- 货架内容将在这里动态生成 -->
            </div>
            
            <!-- 分页控制 -->
            <div class="pagination">
                <button class="btn btn-warning" id="prev-page">上一页</button>
                <span id="page-info">第 1 页 / 共 5 页</span>
                <button class="btn btn-warning" id="next-page">下一页</button>
            </div>
        </section>
    </div>
    
    <!-- 支付选择模态框 -->
    <div class="modal" id="payment-modal">
        <div class="modal-content">
            <h2>選擇支付方式</h2>
            <p id="payment-item-name">裝備名稱</p>
            <div class="modal-buttons">
                <button class="btn btn-warning" id="pay-silver-btn">使用銀兩支付</button>
                <button class="btn btn-primary" id="pay-spirit-btn">使用靈石支付</button>
            </div>
            <button class="btn" id="cancel-payment-btn" style="margin-top: 15px;">取消</button>
        </div>

		// 價格計算算法
function calculateItemPrice(item) {
    // 基礎價格計算
    let baseValue = 0;
    
    // 根據bonus數值計算基礎價值
    const bonusSum = (item.bonuses.trade || 0) + 
                    (item.bonuses.wealth || 0) + 
                    (item.bonuses.draw || 0);
    
    baseValue = Math.floor(bonusSum * 100); // 每個屬性點價值100
    
    // 如果有special效果，價格大幅提升
    if (item.special) {
        baseValue *= 1.5; // 有特殊效果價格提升50%
    }
    
    // 銀兩價格 (上限250)
    const silverPrice = Math.min(Math.floor(baseValue * 0.8), 250);
    
    // 靈石價格 (上限500)
    const spiritPrice = Math.min(Math.floor(baseValue * 1.2), 500);
    
    // 確保最低價格
    return {
        silver: Math.max(silverPrice, 30),  // 最低30銀兩
        spirit: Math.max(spiritPrice, 10)   // 最低10靈石
    };
}
		

// 从主网页获取玩家数据
function getPlayersFromMainPage() {
    // 从 localStorage 获取玩家数据
    const players = JSON.parse(localStorage.getItem('players')) || [];
    
    // 如果没有玩家数据，返回空数组
    if (players.length === 0) {
        return [
            { id: 1, name: "玩家一", spiritStones: 0, inventory: [] },
            { id: 2, name: "玩家二", spiritStones: 0, inventory: [] },
            { id: 3, name: "玩家三", spiritStones: 0, inventory: [] }
        ];
    }
    
    // 转换数据结构以匹配现有代码
    return players.map((player, index) => ({
        id: index + 1,
        name: player.name,
        spiritStones: 0, // 这里先设为0，后面从sell.html获取真实数据
        inventory: player.inventory || []
    }));
}
// 从 sell.html 获取玩家灵石数据
function getSpiritStonesFromSellPage(playerName) {
    try {
        console.log(`正在为玩家 ${playerName} 获取灵石数据...`);
        
        // 方法1：从 auctionData 获取
        const auctionData = localStorage.getItem('auctionData');
        if (auctionData) {
            try {
                const data = JSON.parse(auctionData);
                if (data.players && data.players[playerName]) {
                    const spiritStones = data.players[playerName].spiritStones || 0;
                    console.log(`从 auctionData 找到 ${playerName} 的灵石:`, spiritStones);
                    return spiritStones;
                }
            } catch (e) {
                console.log('解析 auctionData 失败');
            }
        }
        
        // 方法2：从 players 数据中获取（备用）
        const playersData = localStorage.getItem('players');
        if (playersData) {
            try {
                const players = JSON.parse(playersData);
                const player = players.find(p => p.name === playerName);
                if (player && player.spiritStones !== undefined) {
                    console.log(`从 players 数据找到 ${playerName} 的灵石:`, player.spiritStones);
                    return player.spiritStones;
                }
            } catch (e) {
                console.log('解析 players 数据失败');
            }
        }
        
        console.log(`未找到玩家 ${playerName} 的灵石数据，返回默认值 0`);
        return 0;
        
    } catch (error) {
        console.error('获取灵石数据失败:', error);
        return 0;
    }
}

// 保存灵石数据到 sell.html
function saveSpiritStonesToSellPage(playerName, newSpiritStones) {
    try {
        console.log(`正在保存 ${playerName} 的灵石数据:`, newSpiritStones);
        
        // 获取现有的 auctionData
        let auctionData = { players: {} };
        const existingAuctionData = localStorage.getItem('auctionData');
        if (existingAuctionData) {
            try {
                auctionData = JSON.parse(existingAuctionData);
                if (!auctionData.players) {
                    auctionData.players = {};
                }
            } catch (e) {
                console.log('解析现有 auctionData 失败，创建新数据');
                auctionData = { players: {} };
            }
        }
        
        // 确保玩家数据存在
        if (!auctionData.players[playerName]) {
            auctionData.players[playerName] = {
                spiritStones: 0,
                inventory: []
            };
        }
        
        // 更新灵石数量
        auctionData.players[playerName].spiritStones = newSpiritStones;
        
        // 保存回 localStorage
        localStorage.setItem('auctionData', JSON.stringify(auctionData));
        console.log('灵石数据已保存到 auctionData:', auctionData.players[playerName]);
        
    } catch (error) {
        console.error('保存灵石数据失败:', error);
    }
}

// 固定種子的隨機選擇函數
function getFixedRandomItems(array, count, seed) {
    // 簡單的偽隨機數生成器
    let pseudoRandom = 0;
    for (let i = 0; i < seed.length; i++) {
        pseudoRandom += seed.charCodeAt(i);
    }
    
    const selected = [];
    const usedIndices = new Set();
    
    while (selected.length < count && selected.length < array.length) {
        // 使用種子生成"隨機"索引
        pseudoRandom = (pseudoRandom * 9301 + 49297) % 233280;
        const randomValue = pseudoRandom / 233280;
        const randomIndex = Math.floor(randomValue * array.length);
        
        if (!usedIndices.has(randomIndex)) {
            selected.push(array[randomIndex]);
            usedIndices.add(randomIndex);
        }
        
        // 避免無限循環
        if (usedIndices.size >= array.length) break;
    }
    
    return selected;
}

// 打字机效果函数
function typeWriterEffect(element, text, callback, speed = 50) {
    let i = 0;
    element.innerHTML = '';
    
    function type() {
        if (i < text.length) {
            // 添加文字，保持HTML标签
            element.innerHTML = text.substring(0, i + 1);
            i++;
            setTimeout(type, speed);
            
            // 每次打字时都滚动到底部
            const bargainDialog = document.getElementById('bargain-dialog');
            bargainDialog.scrollTop = bargainDialog.scrollHeight;
        } else {
            if (callback) callback();
        }
    }
    
    type();
}

    }
}

        // 创建与主网页兼容的装备对象
        const equipmentCopy = {
            id: item.id,
            name: item.name,
            type: item.type,
            image: item.image,
            bonuses: {...item.bonuses},
            description: item.description,
            special: item.special || ""
        };
        
        // 确保inventory数组存在
        if (!mainPlayers[playerIndex].inventory) {
            mainPlayers[playerIndex].inventory = [];
        }
        
        // 添加到玩家的装备库
        mainPlayers[playerIndex].inventory.push(equipmentCopy);
        
        // 保存回主网页的players数据
        localStorage.setItem('players', JSON.stringify(mainPlayers));
        
        console.log("装备已成功添加到玩家装备库:", mainPlayers[playerIndex].inventory);
        
        // 更新当前玩家对象
        currentPlayer.inventory = mainPlayers[playerIndex].inventory;
        
        // 调试：检查保存结果
        const savedData = JSON.parse(localStorage.getItem('players'));
        console.log("保存后的玩家数据:", savedData[playerIndex]);
    } else {
        console.error("在主网页数据中找不到玩家:", currentPlayer.name);
    }
}

        // 显示交易结果
        function showTransactionResult(success) {
            const resultModal = document.getElementById('result-modal');
            const resultMessage = document.getElementById('result-message');
            const closeResultBtn = document.getElementById('close-result-btn');
            const goToInventoryBtn = document.getElementById('go-to-inventory-btn');
            
            if (success) {
                resultMessage.textContent = `交易成功！您已获得 ${selectedItem.name}，已添加到您的装备库。`;
            } else {
                resultMessage.textContent = "交易失败，请重试。";
            }
            
            resultModal.style.display = 'flex';
            
            // 设置按钮事件
            closeResultBtn.onclick = () => {
                resultModal.style.display = 'none';
                selectedItem = null;
                // 返回主页面（藏品铺）
                loadShelfPage(currentPage);
            };          
        }

soundControl.addEventListener('click', function() {

});
