        /* 基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;

        body {
            background: #1a1a2e;
            color: #fff;

            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://imgur.com/W4ItYBv.jpg'); /* 替換為您的圖片URL */

            background-position: center;
            background-repeat: no-repeat;

            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            background: rgba(26, 26, 46, 0.8); /* 添加半透明背景 */

            border-radius: 15px;

            backdrop-filter: blur(5px); /* 毛玻璃效果 */
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        h1 {
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        /* 彩蛋模态框样式 */
        .egg-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 从 0.9 改为 0.6，降低黑色透明度 */
            z-index: 10000;
            justify-content: center;
            align-items: center;
            /* 添加背景图片 */
            background-image: url('https://imgur.com/W4ItYBv.jpg');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }
		
/* 七彩變色特殊獎勵效果 */
.egg-option.special-reward {
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid transparent;
    color: #fff;
    text-shadow: 0 0 10px #fff;
    position: relative;
    overflow: hidden;
    animation: rainbow-border 3s linear infinite, rainbow-text 3s linear infinite;
}

@keyframes rainbow-border {
    0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
    14% { border-color: #ff7f00; box-shadow: 0 0 20px #ff7f00; }
    28% { border-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
    42% { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }
    57% { border-color: #0000ff; box-shadow: 0 0 20px #0000ff; }
    71% { border-color: #4b0082; box-shadow: 0 0 20px #4b0082; }
    85% { border-color: #9400d3; box-shadow: 0 0 20px #9400d3; }
    100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; }
}

@keyframes rainbow-text {
    0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
    14% { color: #ff7f00; text-shadow: 0 0 10px #ff7f00; }
    28% { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
    42% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
    57% { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
    71% { color: #4b0082; text-shadow: 0 0 10px #4b0082; }
    85% { color: #9400d3; text-shadow: 0 0 10px #9400d3; }
    100% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
}

/* 更華麗的七彩背景效果 */
.egg-option.special-reward::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(
        45deg,
        #ff0000, #ff7f00, #ffff00, #00ff00,
        #0000ff, #4b0082, #9400d3, #ff0000
    );
    background-size: 400% 400%;
    border-radius: 8px;
    z-index: -1;
    animation: rainbow-bg 4s linear infinite;
    opacity: 0.3;
}

@keyframes rainbow-bg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 添加閃爍星星效果 */
.egg-option.special-reward::after {
    content: '✨';
    position: absolute;
    top: 5px;
    right: 5px;
    font-size: 1.2rem;
    animation: twinkle 1.5s ease-in-out infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1.2); }
}

        // 初始化随机奖励

            // 随机选择8个基础奖励

            // 随机选择8个追加奖励
            const selectedMultiplier = getRandomItems(allMultiplierRewards, 8);
            // 随机选择8个特殊奖励
            const selectedSpecial = getRandomItems(allSpecialRewards, 8);
            
            // 更新DOM显示
            updateRewardDisplay('egg-grid', selectedBasic, 'egg-option');
            updateRewardDisplay('multiplier-grid', selectedMultiplier, 'multiplier-option');

            // 更新选项引用

        // 辅助函数：从数组中随机选择指定数量的项目
        function getRandomItems(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }
        
// 辅助函数：更新DOM显示
function updateRewardDisplay(containerId, rewards, className) {
    const container = document.getElementById(containerId);
    container.innerHTML = ''; // 清空现有内容
    
    rewards.forEach((reward, index) => {
        const option = document.createElement('div');
        option.className = `egg-option ${className}`;
        option.setAttribute('data-index', index);
        option.textContent = reward;
        
        // 檢查是否為特殊獎勵（包含"免費10抽"、"80銀兩"或"擴展攤位"的項目）
        if (reward.includes('免費10抽') || reward.includes('80銀兩') || reward.includes('擴展攤位')) {
            option.classList.add('special-reward');
        }
        
        container.appendChild(option);
    });
}

        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff'];
            
            for (let i = 0; i < 70; i++) { // 70個禮花粒子
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                
                // 隨機顏色
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // 隨機位置（從按鈕中心發射）
                const buttonRect = triggerButton.getBoundingClientRect();
                const startX = buttonRect.left + buttonRect.width / 2;
                const startY = buttonRect.top + buttonRect.height / 2;
                
                // 隨機大小和形狀
                const size = Math.random() * 8 + 4;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                // 隨機旋轉
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // 設置初始位置
                confetti.style.left = `${startX}px`;
                confetti.style.top = `${startY}px`;
                
                document.body.appendChild(confetti);
                
                // 動畫
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 5;
                const x = Math.cos(angle) * speed;
                const y = Math.sin(angle) * speed;
                
                // 創建動畫
                const animation = confetti.animate([
                    {
                        opacity: 1,
                        transform: `translate(0, 0) rotate(0deg)`
                    },
                    {
                        opacity: 0,
                        transform: `translate(${x * 100}px, ${y * 100}px) rotate(${Math.random() * 720}deg)`
                    }
                ], {
                    duration: Math.random() * 1000 + 1500,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
                });
                
                // 動畫結束後移除元素
                animation.onfinish = () => {
                    confetti.remove();
                };
            }
        }
        
        // 在selectBasicReward函数中添加音效控制
        function selectBasicReward() {
            // 播放闪灯音效
            flashSound.currentTime = 0;
            flashSound.volume = 0.8;
            flashSound.play().catch(e => console.log("闪灯音效播放失败:", e));
            
            // 随机闪光效果
            let flashCount = 0;
            const maxFlashes = 25;
            const flashInterval = 150;
            
            const flashIntervalId = setInterval(() => {
                // 移除所有active类
                options.forEach(option => {
                    option.classList.remove('active');
                });
                
                // 随机选择一个选项高亮
                const randomIndex = Math.floor(Math.random() * options.length);
                options[randomIndex].classList.add('active');
                
                flashCount++;
                
                if (flashCount >= maxFlashes) {
                    clearInterval(flashIntervalId);
                    
                    // 停止闪灯音效
                    flashSound.pause();
                    
                    // 确定最终选择
                    const finalIndex = Math.floor(Math.random() * options.length);
                    
                    // 移除所有active类，只保留selected
                    options.forEach(option => {
                        option.classList.remove('active');
                    });
                    
                    options[finalIndex].classList.add('selected');
                    selectedIndex = finalIndex;
                    
                    // 完成后进行倍數奖励选择
                    setTimeout(selectMultiplierReward, 800);
                }
            }, flashInterval);
        }
