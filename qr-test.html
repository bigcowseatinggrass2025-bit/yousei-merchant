<!DOCTYPE html>
<html>
<head>
    <title>QR碼到網頁連結完整測試</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background: #1a2a3a;
            color: white;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        video {
            width: 300px;
            height: 300px;
            background: #000;
            border: 3px solid #00ff00;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #ffd700;
            border-radius: 10px;
            pointer-events: none;
        }
        .status {
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #2c3e50;
            color: white;
            min-height: 80px;
            border: 2px solid #34495e;
        }
        .test-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px;
            text-align: left;
        }
        .success { background: #27ae60; border-color: #2ecc71; }
        .error { background: #e74c3c; border-color: #c0392b; }
        .scanning { background: #3498db; border-color: #2980b9; }
    </style>
</head>
<body>
    <h1>🎯 QR碼到網頁連結完整測試</h1>
    
    <button onclick="startFullTest()">開始完整測試</button>
    <button onclick="stopTest()">停止測試</button>
    
    <div class="status" id="status">準備開始測試...</div>
    
    <div id="camera-container"></div>
    
    <div class="test-info">
        <h3>📋 測試說明：</h3>
        <p>1. 生成包含以下URL的QR碼：</p>
        <p style="background: #2c3e50; padding: 10px; border-radius: 5px; font-family: monospace;">
            <strong>scratch-card.html?id=test123</strong>
        </p>
        <p>2. 掃描後應該自動嘗試打開這個網頁</p>
        <p>3. 如果網頁不存在會顯示錯誤，但這證明連結功能正常</p>
    </div>

    <script>
        let currentStream = null;
        let scanInterval = null;
        
        function updateStatus(message, type = 'normal') {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = 'status';
            if (type === 'success') status.classList.add('success');
            else if (type === 'error') status.classList.add('error');
            else if (type === 'scanning') status.classList.add('scanning');
            console.log('📢 ' + message.replace(/<[^>]*>/g, ''));
        }
        
        function startFullTest() {
            updateStatus('🚀 開始完整QR碼到網頁測試...');
            
            // 檢查環境
            if (typeof jsQR === 'undefined') {
                updateStatus('❌ jsQR庫未加載！', 'error');
                return;
            }
            
            if (!navigator.mediaDevices?.getUserMedia) {
                updateStatus('❌ 瀏覽器不支持相機', 'error');
                return;
            }
            
            updateStatus('✅ 環境檢查通過，請求相機權限...');
            
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            }).then(stream => {
                currentStream = stream;
                setupFullTest(stream);
            }).catch(error => {
                updateStatus('❌ 相機錯誤: ' + error.message, 'error');
            });
        }
        
        function setupFullTest(stream) {
            const container = document.getElementById('camera-container');
            container.innerHTML = `
                <div style="position: relative; display: inline-block;">
                    <video id="test-video" autoplay playsinline muted></video>
                    <div class="scan-frame"></div>
                    <div id="scan-result" style="position: absolute; bottom: -60px; left: 0; right: 0; text-align: center; color: white; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 5px; border: 2px solid #3498db;">
                        等待掃描QR碼...
                    </div>
                </div>
            `;
            
            const video = document.getElementById('test-video');
            const scanResult = document.getElementById('scan-result');
            
            video.srcObject = stream;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let scanCount = 0;
            
            video.play().then(() => {
                updateStatus('📹 相機啟動成功！<br>請掃描包含刮刮樂URL的QR碼', 'scanning');
                
                scanInterval = setInterval(() => {
                    scanCount++;
                    
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        
                        try {
                            const code = jsQR(imageData.data, imageData.width, imageData.height);
                            
                            if (code) {
                                const scannedUrl = code.data;
                                updateStatus(`🎉 QR掃描成功！<br>檢測到: <strong>${scannedUrl}</strong>`, 'success');
                                scanResult.innerHTML = `✅ 掃描成功！<br>處理中...`;
                                scanResult.style.background = '#27ae60';
                                scanResult.style.borderColor = '#27ae60';
                                
                                // 🆕 完整的URL處理測試
                                processScannedURL(scannedUrl);
                                
                            } else {
                                scanResult.innerHTML = `🔍 掃描中...<br>次數: ${scanCount}`;
                                scanResult.style.background = '#3498db';
                                scanResult.style.borderColor = '#3498db';
                            }
                        } catch (error) {
                            scanResult.innerHTML = '❌ 掃描錯誤';
                            scanResult.style.background = '#e74c3c';
                            scanResult.style.borderColor = '#c0392b';
                        }
                    }
                }, 500);
                
            }).catch(error => {
                updateStatus('❌ 視頻播放失敗: ' + error.message, 'error');
            });
        }
        
        // 🆕 完整的URL處理函數
        function processScannedURL(url) {
            console.log('🔗 開始處理URL:', url);
            updateStatus(`🔗 處理掃描結果:<br>${url}`, 'scanning');
            
            // 停止掃描
            clearInterval(scanInterval);
            
            // 分析URL
            let scratchId = null;
            
            if (url.includes('scratch-card.html')) {
                // 處理完整URL或相對路徑
                const match = url.match(/id=([^&]+)/);
                scratchId = match ? match[1] : null;
            } else if (url.startsWith('http')) {
                // 處理完整HTTP URL
                try {
                    const urlObj = new URL(url);
                    scratchId = urlObj.searchParams.get('id');
                } catch (e) {
                    console.error('URL解析錯誤:', e);
                }
            } else {
                // 直接ID
                scratchId = url;
            }
            
            if (scratchId) {
                updateStatus(`✅ URL解析成功！<br>刮刮樂ID: <strong>${scratchId}</strong>`, 'success');
                
                // 🆕 模擬打開刮刮樂頁面
                setTimeout(() => {
                    const fullUrl = `scratch-card.html?id=${scratchId}`;
                    updateStatus(`🎊 測試完成！<br>將會打開: <strong>${fullUrl}</strong><br><br>在真實環境中會自動跳轉`, 'success');
                    
                    // 在真實環境中取消註釋這行：
                    // window.open(fullUrl, '_blank');
                    
                    // 顯示測試成功訊息
                    alert(`🎉 測試成功！\n掃描到的URL: ${url}\n提取的ID: ${scratchId}\n將會打開: ${fullUrl}`);
                    
                }, 2000);
                
            } else {
                updateStatus(`❌ URL解析失敗<br>無法從中提取刮刮樂ID:<br>${url}`, 'error');
            }
        }
        
        function stopTest() {
            if (scanInterval) clearInterval(scanInterval);
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-container').innerHTML = '';
            updateStatus('🛑 測試已停止');
        }
        
        // 清理
        window.addEventListener('beforeunload', stopTest);
    </script>
</body>
</html>
