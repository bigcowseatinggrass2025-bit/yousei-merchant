<!DOCTYPE html>
<html>
<head>
    <title>QR碼掃描測試</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        video {
            width: 300px;
            height: 300px;
            background: #000;
            border: 3px solid red;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #ffd700;
            border-radius: 10px;
            pointer-events: none;
        }
        .status {
            margin: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #2c3e50;
            color: white;
            min-height: 60px;
        }
        .test-qr {
            margin: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>?? QR碼掃描測試</h1>
    
    <button onclick="startQRTest()">開始QR掃描測試</button>
    <button onclick="stopQRTest()">停止掃描</button>
    
    <div class="status" id="status">點擊"開始QR掃描測試"</div>
    
    <div id="camera-container"></div>
    
    <div class="test-qr">
        <h3>測試用QR碼：</h3>
        <p>請掃描這個測試URL：</p>
        <p style="background: #eee; padding: 10px; border-radius: 5px;">
            <strong>scratch-card.html?id=qr_test_123</strong>
        </p>
        <p>或者用手機生成這個URL的QR碼來測試</p>
    </div>

    <script>
        let currentStream = null;
        let scanInterval = null;
        
        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.style.background = isError ? '#e74c3c' : '#2c3e50';
            console.log('?? ' + message);
        }
        
        function startQRTest() {
            updateStatus('?? 開始QR掃描測試...');
            
            // 檢查jsQR庫
            if (typeof jsQR === 'undefined') {
                updateStatus('? jsQR庫未加載！請檢查網絡', true);
                return;
            }
            updateStatus('? jsQR庫已加載');
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateStatus('? 瀏覽器不支持相機', true);
                return;
            }
            
            // 請求相機權限
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            }).then(stream => {
                currentStream = stream;
                setupQRScanner(stream);
            }).catch(error => {
                updateStatus('? 相機錯誤: ' + error.message, true);
            });
        }
        
        function setupQRScanner(stream) {
            const container = document.getElementById('camera-container');
            container.innerHTML = `
                <div style="position: relative; display: inline-block;">
                    <video id="test-video" autoplay playsinline muted></video>
                    <div class="scan-frame"></div>
                    <div id="scan-result" style="position: absolute; bottom: -50px; left: 0; right: 0; text-align: center; color: white; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px;">
                        等待掃描...
                    </div>
                </div>
            `;
            
            const video = document.getElementById('test-video');
            const scanResult = document.getElementById('scan-result');
            
            video.srcObject = stream;
            
            // 設置QR掃描
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let scanCount = 0;
            
            video.play().then(() => {
                updateStatus('? 相機啟動成功！開始掃描QR碼...');
                
                scanInterval = setInterval(() => {
                    scanCount++;
                    
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        
                        try {
                            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                                inversionAttempts: "dontInvert",
                            });
                            
                            if (code) {
                                updateStatus(`?? <strong>QR掃描成功！</strong><br>檢測到: ${code.data}`);
                                scanResult.textContent = `? 成功: ${code.data}`;
                                scanResult.style.background = '#27ae60';
                                
                                // 成功後繼續掃描（不停止）
                                setTimeout(() => {
                                    scanResult.textContent = '繼續掃描中...';
                                    scanResult.style.background = '#3498db';
                                }, 2000);
                                
                            } else {
                                scanResult.textContent = `?? 掃描中... (${scanCount}次)`;
                                scanResult.style.background = '#3498db';
                            }
                        } catch (error) {
                            scanResult.textContent = '? 掃描錯誤';
                            scanResult.style.background = '#e74c3c';
                        }
                    }
                }, 500); // 每500ms掃描一次
                
            }).catch(error => {
                updateStatus('? 視頻播放失敗: ' + error.message, true);
            });
        }
        
        function stopQRTest() {
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('camera-container').innerHTML = '';
            updateStatus('?? 掃描已停止');
        }
        
        // 頁面卸載時清理
        window.addEventListener('beforeunload', stopQRTest);
    </script>
</body>
</html>
