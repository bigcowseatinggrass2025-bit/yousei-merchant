<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幽街商人 - 彩蛋系统</title>
    <style>
        /* 基础样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        
        h1 {
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        /* 彩蛋模态框样式 */
        .egg-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .egg-content {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(142, 68, 173, 0.7);
            border: 3px solid transparent;
            animation: egg-glow 2s infinite alternate;
        }
        
        @keyframes egg-glow {
            from {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.5),
                           0 0 40px rgba(255, 0, 255, 0.3);
                border-color: #ffd700;
            }
            to {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8),
                           0 0 60px rgba(255, 0, 255, 0.5),
                           0 0 80px rgba(0, 255, 255, 0.3);
                border-color: #ff00ff;
            }
        }
        
        .egg-title {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            animation: text-pulse 2s infinite alternate;
        }
        
        @keyframes text-pulse {
            from { text-shadow: 0 0 10px rgba(255, 215, 0, 0.7); }
            to { text-shadow: 0 0 20px rgba(255, 215, 0, 0.9), 
                            0 0 30px rgba(255, 215, 0, 0.7),
                            0 0 40px rgba(255, 215, 0, 0.5); }
        }
        
        .egg-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        
        .egg-option {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            border: 2px solid rgba(255, 215, 0, 0.3);
            transition: all 0.3s;
            min-height: 80px;
            cursor: default;
        }
        
        .egg-option.active {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }
        
        .egg-option.selected {
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            animation: selected-pulse 1s infinite alternate;
        }
        
        @keyframes selected-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }
        
        .egg-instruction {
            margin: 15px 0;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .egg-result {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            display: none;
        }
        
        .egg-result-text {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .egg-button {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        .egg-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }
        
        .egg-button:active {
            transform: translateY(1px);
        }
        
        .egg-button.close {
            background: linear-gradient(135deg, #ff4757, #ff0000);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }
        
        .egg-button.close:hover {
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.7);
        }
        
        /* 触发按钮样式 */
        .trigger-button {
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(142, 68, 173, 0.5);
        }
        
        .trigger-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(142, 68, 173, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>幽街商人 - 彩蛋系统演示</h1>
        <p>点击下方按钮触发彩蛋音乐和彩蛋方块</p>
        <button class="trigger-button" id="trigger-egg">触发彩蛋</button>
    </div>
    
    <!-- 彩蛋模态框 -->
    <div class="egg-modal" id="egg-modal">
        <div class="egg-content">
            <h2 class="egg-title">彩蛋驚喜活動</h2>
            
            <div class="egg-grid" id="egg-grid">
                <div class="egg-option" data-index="0">全體抽取5張卡片回到手牌</div>
                <div class="egg-option" data-index="1">全體從商會取得2個貨物</div>
                <div class="egg-option" data-index="2">全體從商會取得50銀兩</div>
                <div class="egg-option" data-index="3">全體與成功交易互動3次</div>
                <div class="egg-option" data-index="4">全體與成功交易互動5次</div>
                <div class="egg-option" data-index="5">全體抽取10張卡片回到手牌</div>
            </div>
            
            <p class="egg-instruction" id="egg-instruction">手上最多卡片者點擊開始按鈕</p>
            
            <div class="egg-result" id="egg-result">
                <p class="egg-result-text" id="egg-result-text"></p>
            </div>
            
            <button class="egg-button" id="egg-action-button">開始</button>
        </div>
    </div>
    
    <!-- 彩蛋音乐 -->
    <audio id="egg-sound">
        <source src="sounds/egg15.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const triggerButton = document.getElementById('trigger-egg');
            const eggModal = document.getElementById('egg-modal');
            const eggGrid = document.getElementById('egg-grid');
            const eggInstruction = document.getElementById('egg-instruction');
            const eggResult = document.getElementById('egg-result');
            const eggResultText = document.getElementById('egg-result-text');
            const eggActionButton = document.getElementById('egg-action-button');
            const eggSound = document.getElementById('egg-sound');
            
            const options = eggGrid.querySelectorAll('.egg-option');
            let selectedIndex = -1;
            let isActive = false;
            
            // 触发彩蛋
            triggerButton.addEventListener('click', function() {
                openEggModal();
            });
            
            // 打开彩蛋模态框
            function openEggModal() {
                eggModal.style.display = 'flex';
                
                // 播放彩蛋音乐
                eggSound.currentTime = 0;
                eggSound.play().catch(e => console.log("彩蛋音乐播放失败:", e));
                
                // 重置状态
                resetEggModal();
            }
            
            // 重置彩蛋模态框
            function resetEggModal() {
                options.forEach(option => {
                    option.classList.remove('active', 'selected');
                });
                
                eggResult.style.display = 'none';
                eggActionButton.textContent = '開始';
                eggActionButton.classList.remove('close');
                eggInstruction.textContent = '手上最多卡片者點擊開始按鈕';
                selectedIndex = -1;
                isActive = false;
            }
            
            // 开始按钮点击事件
            eggActionButton.addEventListener('click', function() {
                if (!isActive) {
                    // 开始彩蛋选择过程
                    startEggSelection();
                } else {
                    // 关闭彩蛋模态框
                    eggModal.style.display = 'none';
                }
            });
            
            // 开始彩蛋选择
            function startEggSelection() {
                isActive = true;
                eggActionButton.textContent = '等待...';
                eggActionButton.disabled = true;
                eggInstruction.textContent = '彩蛋選擇中...';
                
                // 随机闪光效果
                let flashCount = 0;
                const maxFlashes = 20; // 闪光次数
                const flashInterval = 100; // 闪光间隔(毫秒)
                
                const flashIntervalId = setInterval(() => {
                    // 移除所有active类
                    options.forEach(option => {
                        option.classList.remove('active');
                    });
                    
                    // 随机选择一个选项高亮
                    const randomIndex = Math.floor(Math.random() * options.length);
                    options[randomIndex].classList.add('active');
                    
                    flashCount++;
                    
                    if (flashCount >= maxFlashes) {
                        clearInterval(flashIntervalId);
                        
                        // 确定最终选择
                        selectedIndex = Math.floor(Math.random() * options.length);
                        options[selectedIndex].classList.remove('active');
                        options[selectedIndex].classList.add('selected');
                        
                        // 显示结果
                        showEggResult();
                    }
                }, flashInterval);
            }
            
            // 显示彩蛋结果
            function showEggResult() {
                const results = [
                    "彩蛋驚喜活動: 全體抽取5張卡片回到手牌",
                    "彩蛋驚喜活動: 全體從商會取得2個貨物", 
                    "彩蛋驚喜活動: 全體從商會取得50銀兩",
                    "彩蛋驚喜活動: 全體與成功交易互動3次",
                    "彩蛋驚喜活動: 全體與成功交易互動5次",
                    "彩蛋驚喜活動: 全體抽取10張卡片回到手牌"
                ];
                
                eggResultText.textContent = results[selectedIndex];
                eggResult.style.display = 'block';
                
                // 更新按钮状态
                eggActionButton.textContent = '關閉';
                eggActionButton.classList.add('close');
                eggActionButton.disabled = false;
                
                // 在实际应用中，这里应该执行相应的游戏效果
                // applyEggEffect(selectedIndex);
            }
            
            // 应用彩蛋效果（在实际游戏中使用）
            function applyEggEffect(index) {
                // 这里应该根据index执行相应的游戏效果
                console.log("应用彩蛋效果:", index);
                
                // 示例效果：
                switch(index) {
                    case 0:
                        // 全體抽取5張卡片回到手牌
                        break;
                    case 1:
                        // 全體從商會取得2個貨物
                        break;
                    case 2:
                        // 全體從商會取得50銀兩
                        break;
                    case 3:
                        // 全體與成功交易互動3次
                        break;
                    case 4:
                        // 全體與成功交易互動5次
                        break;
                    case 5:
                        // 全體抽取10張卡片回到手牌
                        break;
                }
            }
        });
    </script>
</body>
</html>
