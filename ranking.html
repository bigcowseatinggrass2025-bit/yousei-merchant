    <script>
	   // Supabase配置
    const SUPABASE_URL = 'https://yfjvwwkelkvnlcdyqeck.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6OMKW1OxdLUhY3U3VGEYcQ_JIfFrFOP';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 全局数据（只声明一次！）
    let playerData = [];
    let rankings = JSON.parse(localStorage.getItem('youseiHallOfFame')) || {
        wealth: [],
        trades: [],
        luck: [],
        time: [],
        streak: []
    };
    let gameRecords = JSON.parse(localStorage.getItem('youseiGameRecords')) || [];
    let currentPage = 1;
    const recordsPerPage = 10;
	
	// 数据库操作函数 - 完整版本
const db = {
    // 保存游戏记录到数据库
    async saveGameRecord(record) {
        try {
            console.log('💾 保存游戏记录到数据库...');
            
            // 1. 插入游戏记录
            const { data: gameData, error: gameError } = await supabase
                .from('game_records')
                .insert({
                    game_date: new Date().toISOString(),
                    duration: record.duration
                })
                .select()
                .single();

            if (gameError) throw gameError;

            // 2. 插入玩家战绩
            const playerRecords = record.players.map(player => ({
                game_id: gameData.id,
                player_name: player.name,
                trade_count: player.tradeCount || 0,
                lottery_wins: player.lotteryWins || 0,
                spirit_stones: player.spiritStones || 0,
                silver: player.silver || 0,
                is_winner: record.winner === player.name
            }));

            const { error: playersError } = await supabase
                .from('player_records')
                .insert(playerRecords);

            if (playersError) throw playersError;

            console.log('✅ 游戏记录已保存到数据库');
            return true;
        } catch (error) {
            console.error('❌ 保存游戏记录失败:', error);
            return false;
        }
    },

    // 更新排行榜到数据库
    async updateLeaderboards(rankings) {
        try {
            const leaderboardEntries = [];
            
            // 处理财富排行榜
            rankings.wealth.forEach(item => {
                leaderboardEntries.push({
                    player_name: item.name,
                    category: 'wealth',
                    value: item.value
                });
            });

            // 处理交易排行榜
            rankings.trades.forEach(item => {
                leaderboardEntries.push({
                    player_name: item.name,
                    category: 'trades',
                    value: item.value
                });
            });

            // 处理运气排行榜
            rankings.luck.forEach(item => {
                leaderboardEntries.push({
                    player_name: item.name,
                    category: 'luck',
                    value: item.value
                });
            });

            // 处理时长排行榜
            rankings.time.forEach(item => {
                leaderboardEntries.push({
                    player_name: item.name,
                    category: 'time',
                    value: typeof item.value === 'string' ? 0 : item.value
                });
            });

            // 处理连胜排行榜
            const streakRanking = calculateWinStreaks();
            streakRanking.forEach(item => {
                leaderboardEntries.push({
                    player_name: item.name,
                    category: 'streak',
                    value: item.value
                });
            });

            // 批量插入排行榜数据
            const { error } = await supabase
                .from('leaderboards')
                .insert(leaderboardEntries);

            if (error) throw error;
            console.log('✅ 排行榜数据已保存到数据库');
            return true;
        } catch (error) {
            console.error('❌ 保存排行榜数据失败:', error);
            return false;
        }

    // 从数据库加载排行榜
    async loadLeaderboards() {
        try {
            const { data, error } = await supabase
                .from('leaderboards')
                .select('*')
                .order('value', { ascending: false });

            if (error) throw error;

            // 按分类重新组织数据
            const dbRankings = {
                wealth: [],
                trades: [],
                luck: [],
                time: [],
                streak: []
            };

            data.forEach(item => {
                if (dbRankings[item.category]) {
                    dbRankings[item.category].push({
                        name: item.player_name,
                        value: item.value,
                        time: item.achieved_at,
                        date: new Date(item.achieved_at).toLocaleDateString('zh-TW')
                    });
                }
            });

            // 每个分类只保留前100名
            Object.keys(dbRankings).forEach(category => {
                dbRankings[category] = dbRankings[category]
                    .sort((a, b) => b.value - a.value)
                    .slice(0, 100);
            });

            return dbRankings;
        } catch (error) {
            console.error('❌ 加载排行榜数据失败:', error);
            return null;
        }
    },

    // 从数据库加载游戏记录
    async loadGameRecords() {
        try {
            const { data, error } = await supabase
                .from('game_records')
                .select(`
                    *,
                    player_records(*)
                `)
                .order('game_date', { ascending: false })
                .limit(100);

            if (error) throw error;

            // 转换为前端格式
            const records = data.map(game => {
                const players = game.player_records || [];
                const winnerRecord = players.find(p => p.is_winner);
                
                return {
                    id: game.id,
                    timestamp: new Date(game.game_date).toLocaleString('zh-TW'),
                    date: new Date(game.game_date).toLocaleDateString('zh-TW'),
                    duration: game.duration,
                    players: players.map(p => ({
                        name: p.player_name,
                        tradeCount: p.trade_count,
                        lotteryWins: p.lottery_wins,
                        spiritStones: p.spirit_stones,
                        silver: p.silver
                    })),
                    winner: winnerRecord ? winnerRecord.player_name : null
                };
            });

            return records;
        } catch (error) {
            console.error('❌ 加载游戏记录失败:', error);
            return [];
        }
    }
};

// 从存储获取游戏时长
function getGameDurationFromStorage() {
    const startTime = localStorage.getItem('gameStartTime');
    const endTime = localStorage.getItem('gameEndTime');
    
    console.log('重新计算 - 开始:', startTime);
    console.log('重新计算 - 结束:', endTime);
    
    if (startTime && endTime) {
        const start = new Date(startTime);
        const end = new Date(endTime);
        const durationMs = end - start;
        const durationMinutes = Math.floor(durationMs / (1000 * 60));
        
        console.log('重新计算 - 结果:', durationMinutes + '分钟');
        
        if (durationMinutes < 60) {
            return `${durationMinutes}分钟`;
        } else {
            const hours = Math.floor(durationMinutes / 60);
            const mins = durationMinutes % 60;
            return mins > 0 ? `${hours}小时${mins}分钟` : `${hours}小时`;
        }
    }
    
    return '未知时长';
}

		// 计算连胜排行榜
function calculateWinStreaks() {
    const winCounts = {};
    
    // 统计每个玩家的胜场次数
    gameRecords.forEach(record => {
        if (record.winner) {
            winCounts[record.winner] = (winCounts[record.winner] || 0) + 1;
        }
    });
    
    // 转换为数组并排序
    const streakRanking = Object.entries(winCounts)
        .map(([name, wins]) => ({
            name: name,
            value: wins,
            time: new Date().toLocaleString('zh-TW'),
            date: new Date().toLocaleDateString('zh-TW')
        }))
        .sort((a, b) => b.value - a.value)
        .slice(0, 100);
    
    return streakRanking;
}

// 找出胜出者
function findWinner(players) {
    return players.reduce((prev, current) => 
        (prev.silver || 0) > (current.silver || 0) ? prev : current
    ).name;
}

    // 分页按钮的事件监听器
    document.getElementById('prev-page').addEventListener('click', function() {
        if (currentPage > 1) {
            currentPage--;
            updateRecordsTable();
        }
    });
    
    document.getElementById('next-page').addEventListener('click', function() {
        const totalPages = Math.ceil(gameRecords.length / recordsPerPage);
        if (currentPage < totalPages) {
            currentPage++;
            updateRecordsTable();
        }
    });
}
// 在排行榜代码末尾添加
document.addEventListener('click', function(e) {
    if (e.target.id === 'save-results' || e.target.closest('#save-results')) {
        console.log('🎯 事件委托捕获到保存按钮点击');
        e.preventDefault();
        e.stopPropagation();
        saveResults();
    }
});
