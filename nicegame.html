		/* 天灯发光效果 */
.lantern.lit .lantern-body {
    box-shadow: 0 0 20px 10px rgba(255, 215, 0, 0.8),
                0 0 40px 20px rgba(255, 165, 0, 0.6),
                0 0 60px 30px rgba(255, 69, 0, 0.4);
    animation: flicker 1.5s infinite alternate;
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
}


		/* 添加闪烁动画 */
@keyframes blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 20px 5px gold; }
    50% { opacity: 0.7; box-shadow: 0 0 30px 8px gold, 0 0 40px 12px rgba(255,215,0,0.6); }
}

.grid-item.active {
    box-shadow: 0 0 15px 5px gold;
    transform: scale(1.1);
    z-index: 5;
    animation: blink 0.8s infinite;
}
		
		
		 /* 花灯容器样式 - 水平排列 */
.lantern-selection {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 30px 0;
    flex-wrap: wrap;
}

/* 花灯样式 - 使用图片 */
.quiz-lantern {
    width: 120px;
    height: 180px;
    position: relative;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;

.quiz-lantern:hover {
    transform: translateY(-5px) scale(1.05);
}

    width: 100%;
    height: 120px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    margin-bottom: 10px;
}

.quiz-lantern-number {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);

    height: 30px;

    border-radius: 50%;

    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #000;
    z-index: 10;

/* 响应式调整 */
@media (max-width: 768px) {
    .lantern-selection {
        gap: 20px;

        /* 替換原有的 .btn-try 樣式 */
.btn-try {
  --glow-color: rgb(217, 176, 255);
  --glow-spread-color: rgba(191, 123, 255, 0.781);
  --enhanced-glow-color: rgb(231, 206, 255);
  --btn-color: rgb(100, 61, 136);
  
  border: .25em solid var(--glow-color);
  padding: 1em 3em;
  color: var(--glow-color);
  font-size: 15px;
  font-weight: bold;
  background-color: var(--btn-color);
  border-radius: 1em;
  outline: none;
  box-shadow: 0 0 1em .25em var(--glow-color),
          0 0 4em 1em var(--glow-spread-color),
          inset 0 0 .75em .25em var(--glow-color);
  text-shadow: 0 0 .5em var(--glow-color);
  position: relative;
  transition: all 0.3s;
  cursor: pointer;
  display: block;
  width: 80%;
  margin: 0 auto;
}

.btn-try::after {
  pointer-events: none;
  content: "";
  position: absolute;
  top: 120%;
  left: 0;
  height: 100%;
  width: 100%;
  background-color: var(--glow-spread-color);
  filter: blur(2em);
  opacity: .7;
  transform: perspective(1.5em) rotateX(35deg) scale(1, .6);
}

.btn-try:hover:not(:disabled) {
  color: var(--btn-color);
  background-color: var(--glow-color);
  box-shadow: 0 0 1em .25em var(--glow-color),
          0 0 4em 2em var(--glow-spread-color),
          inset 0 0 .75em .25em var(--glow-color);
  transform: translateY(-2px);
}

.btn-try:active {
  box-shadow: 0 0 0.6em .25em var(--glow-color),
          0 0 2.5em 2em var(--glow-spread-color),
          inset 0 0 .5em .25em var(--glow-color);
}

.btn-try:disabled {
  background-color: #6c757d;
  border-color: #6c757d;
  cursor: not-allowed;
  opacity: 0.7;
  box-shadow: none;
  text-shadow: none;
}

.btn-try:disabled::after {
  display: none;
}

       .click-target {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f72585, #4361ee);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(247, 37, 133, 0.8),
                0 0 30px rgba(128, 0, 128, 0.6);
    transition: transform 0.3s;
    opacity: 0; /* 初始状态为透明 */
    animation: fadeIn 0.8s ease-out forwards, 
               gentleMove 4s ease-in-out infinite,
               glowPulse 2s ease-in-out infinite alternate;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.5) rotate(0deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(360deg);
    }
}

@keyframes gentleMove {
    0%, 100% {
        transform: translate(0, 0) rotate(0deg);
    }
    25% {
        transform: translate(3px, -3px) rotate(2deg);
    }
    50% {
        transform: translate(-2px, 2px) rotate(-2deg);
    }
    75% {
        transform: translate(2px, 3px) rotate(1deg);
    }
}

@keyframes glowPulse {
    0% {
        box-shadow: 0 0 15px rgba(247, 37, 133, 0.8),
                    0 0 30px rgba(128, 0, 128, 0.6);
    }
    100% {
        box-shadow: 0 0 25px rgba(247, 37, 133, 1),
                    0 0 45px rgba(128, 0, 128, 0.8),
                    0 0 60px rgba(75, 0, 130, 0.4);
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
        transform: scale(1);
    }
    to {
        opacity: 0;
        transform: scale(0.5);
    }
}


@keyframes glow-pulse {
    0% {
        text-shadow: 0 0 10px #4cc9f0, 
                     0 0 20px #4cc9f0, 
                     0 0 30px #4cc9f0;
    }
    100% {
        text-shadow: 0 0 15px #4cc9f0, 
                     0 0 30px #4cc9f0, 
                     0 0 45px #4cc9f0,
                     0 0 60px #4cc9f0;
    }
}

.click-target:hover {

}

}

@keyframes x-win {
    0%, 100% { 
        text-shadow: 0 0 10px #f94144, 0 0 20px #f94144, 0 0 30px #f94144;

        // 修改显示结果函数，添加奖励加成检测
function showResult(container, message, type) {
    // 如果已经显示结果，不再重复显示
    if (container.querySelector('.result-area')) return;
    
    // 检查是否有慈善奖励加成
    let bonusApplied = false;
    let originalMessage = message;
    
    if (charityBonusActive && type === 'success') {
        // 提取奖励数值并翻倍
        const rewardMatch = message.match(/(\d+)/);
        if (rewardMatch) {
            const originalReward = parseInt(rewardMatch[1]);
            const doubledReward = originalReward * 2;
            message = message.replace(originalReward, doubledReward);
            
            // 添加奖励加成提示
            message += " (善心獎勵翻倍)";
            bonusApplied = true;
        }
    }
    
    const resultArea = document.createElement('div');
    resultArea.className = `result-area ${type}-result`;
    resultArea.textContent = message;
    
    // 如果有奖励加成，添加额外提示
    if (bonusApplied) {
        const bonusMessage = document.createElement('div');
        bonusMessage.className = 'bonus-message';
        bonusMessage.textContent = '由於你懷有善心，獲得獎金加乘！';
        bonusMessage.style.marginTop = '10px';
        bonusMessage.style.fontSize = '1.2rem';
        resultArea.appendChild(bonusMessage);
    }
    
    container.appendChild(resultArea);
    
    // 添加关闭按钮
    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-btn';
    closeBtn.textContent = '關閉';
    closeBtn.style.marginTop = '20px';
    
    closeBtn.onclick = function() {
        document.getElementById('gameScreen').style.display = 'none';
        // 启用所有按钮
        enableAllButtons();
        
        // 移除游戏卡片发光效果
        document.querySelectorAll('.game-card').forEach(card => {
            card.classList.remove('highlight');
        });
    };
    
    container.appendChild(closeBtn);
    
    // 设置游戏结束状态
    gameEnded = true;
    
    // 显示全局遮罩
    setTimeout(function() {
        document.getElementById('overlayMask').classList.add('active');
    }, 6000);
}

        gameTitle.style.color = '#4cc9f0';

            const progress = elapsed / duration;
            
            // 当时间接近结束时，开始倒计时效果
            if (progress > 0.8 && !finalCountdown) {
                finalCountdown = true;
                startFinalCountdown();
                return;
            }
            
            speed = 50 + Math.floor(progress * 200);
            elapsed += speed;
            
            if (elapsed < duration) {

                                secondChanceMsg.textContent = `攤主:「今天心情好，免費！再給你一次機會啦！再錯就沒辦法了！」 (${quizRetryCount}/${MAX_QUIZ_RETRIES})`;
                                container.appendChild(secondChanceMsg);
                                
                                // 2秒后显示新的花灯选择
                                setTimeout(() => {
                                    container.removeChild(secondChanceMsg);
                                    resetQuizGame(container, game, allQuestions);
                                }, 2000);
                            }, 1500);
                        } else {
                            // 没有重试机会了，直接显示失败
                            setTimeout(() => {
                                showResult(container, '回答錯誤！沒有獲得獎勵', 'failure');
                            }, 1000);
                        }
                    }
                };
                
                optionsContainer.appendChild(optionEl);
            });
            
            container.appendChild(optionsContainer);
        }
        
        // 重置猜谜游戏函数
        function resetQuizGame(container, game, previousQuestions) {
            // 清除现有内容
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            
            // 添加游戏说明
            const instruction = document.createElement('p');
            instruction.textContent = '請選擇一個花燈，回答其中的問題';
            instruction.style.color = '#f9c74f';
            instruction.style.marginBottom = '20px';
            instruction.style.textAlign = 'center';
            container.appendChild(instruction);
            
            // 创建花灯选择界面
            const lanternSelection = document.createElement('div');
            lanternSelection.className = 'lantern-selection';
            
            // 过滤掉已经回答过的问题
            const availableQuestions = game.questions.filter(q => 
                !previousQuestions.some(pq => pq.question === q.question)
            );
            
            // 选择剩余的问题（最多3个）
            const newQuestions = [];
            const usedIndices = new Set();
            
            while (newQuestions.length < 3 && newQuestions.length < availableQuestions.length) {
                const randomIndex = Math.floor(Math.random() * availableQuestions.length);
                if (!usedIndices.has(randomIndex)) {
                    newQuestions.push(availableQuestions[randomIndex]);
                    usedIndices.add(randomIndex);
                }
            }
            
            // 如果问题不足，从已回答的问题中补充
            if (newQuestions.length < 3) {
                const remainingNeeded = 3 - newQuestions.length;
                const previousCopy = [...previousQuestions];
                
                for (let i = 0; i < remainingNeeded && previousCopy.length > 0; i++) {
                    const randomIndex = Math.floor(Math.random() * previousCopy.length);
                    newQuestions.push(previousCopy[randomIndex]);
                    previousCopy.splice(randomIndex, 1);
                }
            }
            
               // 创建三个花灯 - 修复：添加图片
    newQuestions.forEach((question, index) => {
        const lantern = document.createElement('div');
        lantern.className = `quiz-lantern`;
        
        const image = document.createElement('div');
        image.className = 'quiz-lantern-image';
        // 设置花灯图片
        const lanternImages = [
            'https://imgur.com/cLZ4Kvf.png',
            'https://imgur.com/qocpT1O.png', 
            'https://imgur.com/2AYBm0q.png'
        ];
        image.style.backgroundImage = `url('${lanternImages[index]}')`;
        
        const number = document.createElement('div');
        number.className = 'quiz-lantern-number';
        number.textContent = index + 1;
        
        lantern.appendChild(number);
        lantern.appendChild(image);
        
        lantern.onclick = function() {
            // 禁用所有花灯
            document.querySelectorAll('.quiz-lantern').forEach(l => l.style.pointerEvents = 'none');
            
            // 显示选中的问题
            showQuestion(container, question, game, [...previousQuestions, ...newQuestions]);
        };
        
        lanternSelection.appendChild(lantern);
    });
    
    container.appendChild(lanternSelection);
}
        
       // 创建祈福天燈遊戲 - 添加失败判定
function createLanternGame(container) {
    // 創建高度標示區域
    const heightIndicator = document.createElement('div');
    heightIndicator.className = 'height-indicator';
    heightIndicator.innerHTML = `
        <div class="height-line high-line">
            <span class="height-label">一等獎</span>
        </div>
        <div class="height-line medium-line">
            <span class="height-label">二等獎</span>
        </div>
        <div class="height-line low-line">
            <span class="height-label">三等獎</span>
        </div>
    `;
    container.appendChild(heightIndicator);
    
    const lanternContainer = document.createElement('div');
    lanternContainer.className = 'lantern-container';
    
    // 創建三個天燈
    const templates = ['template1', 'template2', 'template3'];
    
    templates.forEach(template => {
        const lantern = document.createElement('div');
        lantern.className = `lantern ${template}`;

        const body = document.createElement('div');
        body.className = 'lantern-body';
        
        // 隨機設置天燈上的文字
        const texts = ['福', '祿', '壽', '喜', '財'];
        body.textContent = texts[Math.floor(Math.random() * texts.length)];
        
        lantern.appendChild(body);
        
        lantern.onclick = function() {
            if (lantern.classList.contains('launching')) return;
			
            
            // 禁用所有天燈
            document.querySelectorAll('.lantern').forEach(l => l.style.pointerEvents = 'none');
			
			// 添加发光效果 - 点火
    lantern.classList.add('lit');
            
            // 隨機決定天燈飛起的高度 (添加失败判定)
            const result = Math.random();
            let outcome = '';
            
            if (result < 0.2) {
                // 20%概率失败 - 天灯无法升起
                outcome = '失敗';
                lantern.classList.add('failure');
                
                // 添加失败动画（摇晃后坠落）
                setTimeout(() => {
                    // 游戏结束
                    showResult(container, '天燈未能升起！沒有獲得獎勵', 'failure');
                }, 3000);
                
            } else if (result < 0.5) {
                // 30%概率三等獎
                outcome = '三';
                lantern.classList.add('low');
            } else if (result < 0.8) {
                // 30%概率二等獎
                outcome = '二';
                lantern.classList.add('medium');
            } else {
                // 20%概率一等獎
                outcome = '一';
                lantern.classList.add('success');
            }
            
            // 添加起飛動畫類（失败情况除外）
            if (outcome !== '失敗') {
                lantern.classList.add('launching');
                
                // 遊戲結束
                setTimeout(() => {
                    // 根據高度顯示不同結果
                    let message = '';
                    let type = '';
                    
                    if (outcome === '一') {
                        const reward = Math.floor(Math.random() * 30) + 20;
                        message = `天燈到達一等獎！獲得${reward}銀兩`;
                        type = 'success';
                    } else if (outcome === '二') {
                        const reward = Math.floor(Math.random() * 20) + 10;
                        message = `天燈到達二等獎！獲得${reward}銀兩`;
                        type = 'normal';
                    } else {
                        const reward = Math.floor(Math.random() * 10) + 5;
                        message = `天燈到達三等獎！獲得${reward}銀兩`;
                        type = 'normal'; // 
                    }
                    
                    showResult(container, message, type);
                }, 8500);
            }
        };
        
        lanternContainer.appendChild(lantern);
    });
    
    container.appendChild(lanternContainer);
}
        
        
        // 显示游戏结果
        function showResult(container, message, type) {
            // 如果已经显示结果，不再重复显示
            if (container.querySelector('.result-area')) return;
            
            const resultArea = document.createElement('div');
            resultArea.className = `result-area ${type}-result`;
            resultArea.textContent = message;
            
            container.appendChild(resultArea);
            
            // 添加关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.textContent = '關閉';
            closeBtn.style.marginTop = '20px';
            
            closeBtn.onclick = function() {
                document.getElementById('gameScreen').style.display = 'none';
                // 启用所有按钮
                enableAllButtons();
            };
            
            container.appendChild(closeBtn);
            
            // 设置游戏结束状态
            gameEnded = true;
            
            // 显示全局遮罩
            setTimeout(function() {
    document.getElementById('overlayMask').classList.add('active');
}, 6000); // 5000毫秒 = 3秒
            
           
        }
        
        // 关闭遮罩
        function closeOverlay() {
            document.getElementById('overlayMask').classList.remove('active');
        }
        
        // 禁用所有按钮
        function disableAllButtons() {
            buttonsDisabled = true;
            document.querySelectorAll('.btn-try').forEach(btn => {
                btn.disabled = true;
            });
        }
        
        // 启用所有按钮
        function enableAllButtons() {
            buttonsDisabled = false;
            document.querySelectorAll('.btn-try').forEach(btn => {
                btn.disabled = false;
            });
        }
        
        // 启动页面关闭倒计时
function startPageCloseTimer() {
    const countdownEl = document.createElement('div');
    countdownEl.className = 'countdown';
    countdownEl.textContent = '8';
    document.body.appendChild(countdownEl);
    
    let seconds = 8;
    pageCloseTimer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        
        if (seconds <= 0) {
            clearInterval(pageCloseTimer);
            document.body.removeChild(countdownEl);
            // 移除了页面关闭的代码
            // 只保留关闭遮罩
            document.getElementById('overlayMask').classList.remove('active');
        }
    }, 1000);
}
        
        // 检查井字游戏获胜者
        function checkWinner(board, player) {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // 横
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // 竖
                [0, 4, 8], [2, 4, 6]             // 对角
            ];
            
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }
        
        // 检查井字游戏是否平局
        function isBoardFull(board) {
            return board.every(cell => cell !== null);
        }
        
		// 获取随机移动（简单AI）
function getRandomMove(board) {
    const emptyCells = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
    return emptyCells[Math.floor(Math.random() * emptyCells.length)];
}

// 获取中等难度移动（基本策略）
function getMediumMove(board) {
    // 1. 检查是否能立即获胜
    for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
            board[i] = 'O';
            if (checkWinner(board, 'O')) {
                board[i] = null;
                return i;
            }
            board[i] = null;
        }
    }
    
    // 2. 检查是否需要阻止玩家获胜
    for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
            board[i] = 'X';
            if (checkWinner(board, 'X')) {
                board[i] = null;
                return i;
            }
            board[i] = null;
        }
    }
    
    // 3. 优先选择中心位置
    if (board[4] === null) return 4;
    
    // 4. 优先选择角落位置
    const corners = [0, 2, 6, 8];
    const availableCorners = corners.filter(i => board[i] === null);
    if (availableCorners.length > 0) {
        return availableCorners[Math.floor(Math.random() * availableCorners.length)];
    }
    
    // 5. 最后选择边缘位置
    const edges = [1, 3, 5, 7];
    const availableEdges = edges.filter(i => board[i] === null);
    if (availableEdges.length > 0) {
        return availableEdges[Math.floor(Math.random() * availableEdges.length)];
    }
    
    // 备用方案：随机选择
    return getRandomMove(board);
}

// 获取困难难度移动（高级策略）
function getHardMove(board) {
    // 使用极小化极大算法找到最佳移动
    let bestScore = -Infinity;
    let bestMove = null;
    
    for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
            board[i] = 'O';
            let score = minimax(board, 0, false);
            board[i] = null;
            
            if (score > bestScore) {
                bestScore = score;
                bestMove = i;
            }
        }
    }
    
    return bestMove;
}

// 极小化极大算法
function minimax(board, depth, isMaximizing) {
    // 检查游戏状态
    if (checkWinner(board, 'O')) return 10 - depth;
    if (checkWinner(board, 'X')) return depth - 10;
    if (isBoardFull(board)) return 0;
    
    if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
            if (board[i] === null) {
                board[i] = 'O';
                let score = minimax(board, depth + 1, false);
                board[i] = null;
                bestScore = Math.max(score, bestScore);
            }
        }
        return bestScore;
    } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
            if (board[i] === null) {
                board[i] = 'X';
                let score = minimax(board, depth + 1, true);
                board[i] = null;
                bestScore = Math.min(score, bestScore);
            }
        }
        return bestScore;
    }
}
